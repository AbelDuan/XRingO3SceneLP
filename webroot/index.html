<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>玄戒O3 · Abel 调度工具箱</title>
<style>
/* ============================================================
   玄戒O3 · Abel 调度工具箱 —— WebUI 样式
   风格：iOS / Miuix 混合 —— 大圆角卡片、分组列表、胶囊按钮
   主题：跟随系统深浅色（MIUI/Miuix 的 prefers-color-scheme）
   ============================================================ */

:root {
  --bg:        #f2f3f7;
  --bg-elev:   #ffffff;
  --card:      #ffffff;
  --line:      rgba(0, 0, 0, .075);
  --line-soft: rgba(0, 0, 0, .045);
  --text:      #101114;
  --sub:       #8a8f99;
  --sub2:      #a9aeb8;
  --accent:    #0a84ff;
  --accent-2:  #3f9bff;
  --ok:        #24c07a;
  --warn:      #f2a33c;
  --bad:       #ff4d4f;
  --chip-bg:   rgba(120, 120, 128, .12);
  --shadow:    0 1px 2px rgba(16, 18, 24, .05), 0 8px 24px -12px rgba(16, 18, 24, .14);
  --radius:    16px;
  --radius-s:  11px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0b0c0f;
    --bg-elev:   #14161a;
    --card:      #17191e;
    --line:      rgba(255, 255, 255, .09);
    --line-soft: rgba(255, 255, 255, .05);
    --text:      #f2f3f5;
    --sub:       #9aa0ab;
    --sub2:      #767c87;
    --accent:    #3f9bff;
    --accent-2:  #62b0ff;
    --ok:        #35d18b;
    --warn:      #ffb454;
    --bad:       #ff5c5e;
    --chip-bg:   rgba(120, 120, 128, .22);
    --shadow:    0 1px 2px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "MiSans", "HarmonyOS Sans SC",
        "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body { padding-bottom: 28px; }

.mono {
  font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: .92em;
}

/* ---------- 顶栏 ---------- */
header {
  position: sticky; top: 0; z-index: 30;
  /* 关键：不做全屏时状态栏是可见的，顶栏要避开状态栏高度 */
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
header.scrolled { border-bottom-color: var(--line); }

.h-top { display: flex; align-items: center; gap: 9px; }
.h-top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
.h-ver {
  font-size: 11px; color: var(--sub);
  background: var(--chip-bg); padding: 2px 8px; border-radius: 99px;
}
.h-chips { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.h-sub {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--sub); margin-top: 3px; min-height: 17px;
}
.h-sub #saved { margin-left: auto; }

.tabs {
  display: flex; gap: 4px; margin: 10px -16px 0; padding: 0 16px 9px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; border: 0; background: transparent; color: var(--sub);
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 7px 13px; border-radius: 99px; cursor: pointer;
  transition: background .16s, color .16s;
}
.tabs button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

main { padding: 14px 16px 0; }

/* ---------- 分组 ---------- */
.group { margin-bottom: 20px; }
.g-title {
  font-size: 12.5px; font-weight: 600; color: var(--sub);
  padding: 0 4px 7px; letter-spacing: .2px;
}
/* 标题行 = 标题 + 右侧小按钮（同一行，按钮居右）。
   .rh-t 用 inline-flex 是为了让 ⓘ 紧贴标题文字，而不是被 flex:1 推到中间。 */
.g-title.rowhead { display: flex; align-items: center; gap: 10px; }
.g-title.rowhead .rh-t { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.g-title.rowhead .btn { flex: none; margin-left: auto; }

/* ⓘ 说明符号：点它展开该模板卡的详情浮层（与点模板名等效） */
.tpl-i {
  flex: none; width: 15px; height: 15px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 700; font-style: italic; line-height: 1;
  font-family: Georgia, "Times New Roman", serif;
  background: color-mix(in srgb, var(--fg) 11%, transparent);
  color: var(--sub); cursor: pointer; user-select: none;
}
.tpl-i:active { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.g-foot { font-size: 12px; color: var(--sub); line-height: 1.6; padding: 8px 4px 0; }
.g-foot b { color: var(--text); font-weight: 600; }

.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.card > .row + .row { border-top: 1px solid var(--line-soft); }

.row { display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
.row.tappable { cursor: pointer; }
.row.tappable:active { background: var(--line-soft); }
.r-main { flex: 1; min-width: 0; }
.r-t { font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
.r-s { font-size: 12.5px; color: var(--sub); margin-top: 2px; line-height: 1.45; word-break: break-all; }
.r-s .mono { color: var(--sub); }

.kv-row { display: flex; align-items: baseline; gap: 12px; padding: 11px 15px; }
.kv-row + .kv-row { border-top: 1px solid var(--line-soft); }
.kv-row .k { font-size: 13.5px; color: var(--text); flex: none; }
.kv-row .k.mono { color: var(--sub); }
.kv-row .v { margin-left: auto; font-size: 13.5px; color: var(--sub); text-align: right; word-break: break-all; }

.empty { padding: 26px 16px; text-align: center; color: var(--sub); font-size: 13.5px; }

/* ---------- 圆点 / 胶囊 ---------- */
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.d-ok { background: var(--ok); } .d-warn { background: var(--warn); } .d-bad { background: var(--bad); }

.pill {
  font-size: 11.5px; font-weight: 500; padding: 2.5px 8px; border-radius: 99px;
  background: var(--chip-bg); color: var(--sub); white-space: nowrap;
}
.pill.ok     { background: color-mix(in srgb, var(--ok) 16%, transparent);   color: var(--ok); }
.pill.warn   { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad    { background: color-mix(in srgb, var(--bad) 16%, transparent);  color: var(--bad); }
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }

/* ---------- 按钮 ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 10px 16px; border-radius: 12px;
  background: var(--chip-bg); color: var(--text);
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.975); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger  { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.btn.ghost   { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .38; pointer-events: none; }
.btn-row { display: flex; gap: 9px; padding: 12px 15px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; min-width: 108px; }
/* 小尺寸按钮（模板卡「套用」/ 标题行「套用到所选」）：
   刻意**不**用 .btn-row，避免被 .btn-row .btn { flex:1; min-width:108px } 撑开。 */
.btn-xs { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 9px; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 12px 15px; }

.seg { display: flex; background: var(--chip-bg); border-radius: 10px; padding: 3px; gap: 3px; flex: none; }
.seg button {
  border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 12.5px;
  font-weight: 500; padding: 5px 11px; border-radius: 8px; cursor: pointer;
}
.seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

/* ---------- 表单 ---------- */
input.f, select.f, textarea.f {
  font: inherit; font-size: 14px; color: var(--text);
  background: var(--chip-bg); border: 0; border-radius: 10px;
  padding: 9px 12px; outline: none; min-width: 0; width: 100%;
}
select.f { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%),
                    linear-gradient(135deg, var(--sub) 50%, transparent 50%);
  background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}
textarea.f { resize: vertical; line-height: 1.5; }

.sw { position: relative; display: inline-block; width: 47px; height: 29px; flex: none; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
.sw i {
  position: absolute; inset: 0; border-radius: 99px;
  background: var(--chip-bg); transition: background .2s;
}
.sw i::after {
  content: ''; position: absolute; top: 2.5px; left: 2.5px;
  width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .28); transition: transform .2s;
}
.sw input:checked + i { background: var(--ok); }
.sw input:checked + i::after { transform: translateX(18px); }

/* ---------- 提示条 ---------- */
.warnbox {
  margin: 0 15px 12px; padding: 11px 13px; border-radius: 12px;
  font-size: 12.5px; line-height: 1.6;
  background: color-mix(in srgb, var(--warn) 11%, transparent);
  color: var(--text);
}
.warnbox.bad { background: color-mix(in srgb, var(--bad) 11%, transparent); }
.warnbox.ok  { background: color-mix(in srgb, var(--ok) 11%, transparent); }
.warnbox b { font-weight: 600; }

/* ---------- 搜索 ---------- */
.search { position: relative; display: flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: 12px; padding: 9px 13px; box-shadow: var(--shadow); }
.search svg { color: var(--sub2); flex: none; }
.search input {
  flex: 1; border: 0; background: transparent; outline: none;
  font: inherit; font-size: 14.5px; color: var(--text); min-width: 0;
}
.search input::placeholder { color: var(--sub2); }

.filters { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button {
  flex: none; border: 0; background: var(--card); color: var(--sub);
  font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 99px;
  cursor: pointer; box-shadow: var(--shadow);
}
.filters button.on { background: var(--accent); color: #fff; }

/* ---------- 应用列表 ---------- */
.listbox { max-height: 62vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.app-row { display: flex; align-items: center; gap: 11px; padding: 10px 14px; cursor: pointer; }
.app-row + .app-row { border-top: 1px solid var(--line-soft); }
.app-row:active { background: var(--line-soft); }
.app-row.sel { background: color-mix(in srgb, var(--accent) 9%, transparent); }

.app-ico {
  width: 38px; height: 38px; border-radius: 10px; flex: none;
  object-fit: cover; background: var(--chip-bg);
}
.app-ico.ph {
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 16px; font-weight: 600;
}
.app-info { flex: 1; min-width: 0; }
.app-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-pkg  { font-size: 11.5px; color: var(--sub2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-tier {
  font-size: 11px; padding: 3px 8px; border-radius: 99px; flex: none;
  background: var(--chip-bg); color: var(--sub); max-width: 96px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 右上角刷新小按钮（连接状态旁边） */
.h-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; margin-left: 6px; padding: 0;
  border-radius: 50%; cursor: pointer;
  background: color-mix(in srgb, var(--fg) 9%, transparent);
  border: 1px solid color-mix(in srgb, var(--fg) 14%, transparent);
  color: var(--sub); transition: transform .25s ease, color .2s ease;
}
.h-btn:active { transform: rotate(180deg); color: var(--accent); }

/* 开关行（模式同步线程） */
.swrow { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.swrow input { display: none; }
.sw {
  flex: 0 0 auto; width: 40px; height: 23px; margin-top: 2px; border-radius: 12px;
  background: color-mix(in srgb, var(--fg) 16%, transparent); position: relative;
  transition: background .18s ease;
}
.sw::after {
  content: ''; position: absolute; top: 2.5px; left: 2.5px; width: 18px; height: 18px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .18s ease;
}
.swrow input:checked + .sw { background: var(--accent); }
.swrow input:checked + .sw::after { transform: translateX(17px); }
.swtxt { font-size: 13.5px; line-height: 1.55; }
.sws { display: block; margin-top: 3px; font-size: 11.5px; color: var(--sub2); line-height: 1.6; }

.app-tier.none { color: var(--sub2); }
.app-tier.set  { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }

/* ---------- 紧凑选择行（模板页 / 游戏页：一屏显示更多应用） ---------- */
.app-row .app-sel { width: 18px; height: 18px; flex: none; margin: 0; accent-color: var(--accent); }
.app-row.pick, .app-row.ro { padding: 6px 12px; gap: 9px; }
.app-row.ro { cursor: default; }
.app-row.pick .app-ico, .app-row.ro .app-ico { width: 26px; height: 26px; border-radius: 7px; font-size: 13px; }
.app-row.pick .app-info, .app-row.ro .app-info { display: flex; align-items: baseline; gap: 7px; }
.app-row.pick .app-name, .app-row.ro .app-name { font-size: 13px; flex: 0 1 auto; max-width: 46%; }
.app-row.pick .app-pkg, .app-row.ro .app-pkg { flex: 1 1 auto; }
.app-row.pick .app-tier, .app-row.ro .app-tier { max-width: 88px; }

.ck {
  width: 21px; height: 21px; border-radius: 50%; flex: none;
  border: 1.5px solid var(--line); position: relative;
}
.ck.on { background: var(--accent); border-color: var(--accent); }
.ck.on::after {
  content: ''; position: absolute; left: 6.6px; top: 3.2px;
  width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(43deg);
}
.virtual-hint { padding: 13px; text-align: center; color: var(--sub2); font-size: 12.5px; }

/* ---------- 底部操作条 ---------- */
.actionbar {
  position: fixed; left: 0; right: 0; z-index: 40;
  bottom: 0;
  padding: 11px 16px calc(11px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg-elev) 88%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 11px;
  transform: translateY(130%); transition: transform .24s cubic-bezier(.32, .72, 0, 1);
}
.actionbar.on { transform: none; }
.ab-t { flex: 1; font-size: 13px; color: var(--sub); }

/* ---------- 模板卡 ---------- */
.tpl {
  border-radius: var(--radius-s); background: var(--card);
  box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 10px;
  position: relative;
}
.tpl:last-child { margin-bottom: 0; }
.tpl-h { display: flex; align-items: center; gap: 8px; margin-bottom: 0; }
/* .tpl-n = 名称 + ⓘ 的紧贴组合。ⓘ 必须跟名称在同一个 inline-flex 里，
   否则会被 .tpl-h 的 gap 均分，视觉上「飘」在名称与徽标之间。 */
.tpl-h .tpl-n { display: inline-flex; align-items: center; gap: 5px; min-width: 0; flex: 1; }
.tpl-h .n { font-size: 14.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl-h .n[data-act] { cursor: pointer; }
/* 卡内「套用」：与标题同一行、居右、小尺寸（margin-left:auto 把它推到底） */
.tpl-apply { flex: none; margin-left: auto; }
/* 模板详情（其余 / 最重 / 次重 / comm）：
   默认隐藏；展开时**内联**在卡片里（普通文档流），由卡片自己撑高。
   ⚠ 曾经是 position:absolute + top:41px —— 内容一多就超出卡片下边界，
     被 .card 的 overflow:hidden 裁掉，用户报「超出部分看不见」。
     改成流式块根治；顺便加 max-height + 滚动兜底极端情况。 */
.tpl-b {
  display: none;
  flex-wrap: wrap; gap: 6px; margin-top: 9px; padding: 10px 11px;
  background: var(--chip-bg);
  border-radius: var(--radius-s);
  max-height: 40vh; overflow-y: auto;
}
.tpl.tips .tpl-b { display: flex; }
.tpl-p {
  font-size: 11.5px; color: var(--sub); background: var(--chip-bg);
  padding: 3px 8px; border-radius: 7px;
}

/* ---------- 核心格子 ---------- */
.cpu-map { display: flex; flex-direction: column; gap: 9px; padding: 13px 15px; }
.cluster { display: flex; align-items: center; gap: 10px; }
.cl-name { font-size: 12px; color: var(--sub); width: 46px; flex: none; }
.cores { display: flex; gap: 6px; flex-wrap: wrap; }
.core {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 500; cursor: pointer; user-select: none;
  background: var(--chip-bg); color: var(--sub2);
  border: 1.5px solid transparent; transition: background .13s, color .13s;
}
.core.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---------- 弹层 ---------- */
.sheet-bg {
  position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .38);
  opacity: 0; transition: opacity .22s;
}
.sheet-bg.on { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  background: var(--bg-elev);
  border-radius: 22px 22px 0 0;
  max-height: 88vh; display: flex; flex-direction: column;
  transform: translateY(102%); transition: transform .26s cubic-bezier(.32, .72, 0, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.on { transform: none; }
.sheet-h {
  display: flex; align-items: center; gap: 10px;
  padding: 15px 16px 11px; border-bottom: 1px solid var(--line-soft); flex: none;
}
.sheet-h .t { font-size: 16px; font-weight: 600; flex: 1; }
.sheet-b { overflow-y: auto; padding: 14px 16px 4px; -webkit-overflow-scrolling: touch; }
.sheet > .btn-row { flex: none; }
.sheet-b .group { margin-bottom: 18px; }
.sheet-b .card { box-shadow: none; background: var(--bg); }
.sheet-b .sheet-b .card { background: var(--card); }

/* ---------- 代码块 ---------- */
pre {
  margin: 0; padding: 13px 15px; overflow-x: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11.5px; line-height: 1.55; color: var(--sub);
  white-space: pre-wrap; word-break: break-all;
  max-height: 40vh; -webkit-overflow-scrolling: touch;
}
pre.tall { max-height: 62vh; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 14px); z-index: 90;
  max-width: 84vw; padding: 11px 18px; border-radius: 13px;
  background: rgba(20, 21, 26, .94); color: #fff;
  font-size: 13.5px; line-height: 1.45; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
@media (prefers-color-scheme: dark) { #toast { background: rgba(240, 241, 245, .96); color: #101114; } }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 加载指示 ---------- */
.spin {
  display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
  border: 2px solid var(--chip-bg); border-top-color: var(--accent);
  border-radius: 50%; animation: sp .7s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }

.hidden { display: none !important; }

/* ---------- 模式阶梯：精简表格 ---------- */
.modetbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.modetbl th, .modetbl td {

<script>
/* ==== app.js ==== */
/* ============================================================
   玄戒O3 · Abel 调度工具箱 —— WebUI 前端 (1/3)
     Bridge  —— KernelSU 原生桥适配（形状按官方 kernelsu 包实测校正）
     Api     —— 调 webui.sh 后端（唯一写入口，含备份/自检/同步进模块）
     Model   —— 4 级模式阶梯（频率 + 线程分配）⇄ profile.json / threads.json
     Views   —— 概览 / 模式 / 应用
   ============================================================ */
'use strict';

const MOD_ID = 'SceneO3Tuner';
const STATE_DIR = '/data/adb/SceneO3Tuner';
const WEB_DIR = STATE_DIR + '/webui';
const MODDIR = '/data/adb/modules/' + MOD_ID;
const SCRIPT = MODDIR + '/Scripts/4+4+2/O3/webui.sh';
const SCENE_DIR = '/data/data/com.omarea.vtools/files';

/* ============================================================
   1) Bridge —— KernelSU 原生桥
   ------------------------------------------------------------
   ★ 关键（曾因此整站失效）：原生桥的真实形状与「Promise 风格」完全不同。
     官方 kernelsu npm 包的实现是：

       ksu.exec(command, JSON.stringify(options), callbackFuncName)
       window[callbackFuncName] = (errno, stdout, stderr) => {...}

     · exec 是 **3 个参数**，第三个是「挂在 window 上的回调函数名」字符串，
       不是函数本身，也不返回 Promise。
     · listPackages(type) / getPackagesInfo(pkgs) 返回 **JSON 字符串**，必须 parse。
     · 本构建里**没有** ksu:// 图标协议，图标只能运行时探测。
   ============================================================ */
const Bridge = {
  K: null,
  execMode: '',
  isRoot: true,
  iconOk: false,
  probes: [],
  _n: 0,

  detect() { this.K = window.ksu || window.kernelsu || null; return !!this.K; },
  keys() { if (!this.K) return []; try { return Object.keys(this.K); } catch (e) { return []; } },
  has(fn) { return !!(this.K && typeof this.K[fn] === 'function'); },

  _official(cmd, timeout) {
    return new Promise(res => {
      const name = '__ksucb_' + (++this._n) + '_' + Date.now();
      let done = false;
      const fin = r => { if (!done) { done = true; try { delete window[name]; } catch (e) { } res(r); } };
      window[name] = (errno, stdout, stderr) => fin({
        code: parseInt(errno, 10) || 0,
        out: String(stdout == null ? '' : stdout) + String(stderr == null ? '' : stderr)
      });
      try { this.K.exec(cmd, JSON.stringify({}), name); }
      catch (e) { fin({ code: 1, out: 'ERR ' + e }); }
      setTimeout(() => fin({ code: 1, out: 'ERR^no-callback' }), timeout);
    });
  },
  _cbFn(cmd, timeout) {
    return new Promise(res => {
      let done = false;
      const fin = r => { if (!done) { done = true; res(r); } };
      try {
        this.K.exec(cmd, (a, b, c) => fin({
          code: typeof a === 'number' ? a : 0,
          out: (typeof a === 'string' ? a : '') + String(b == null ? '' : b) + String(c == null ? '' : c)
        }));
      } catch (e) { fin({ code: 1, out: 'ERR ' + e }); }
      setTimeout(() => fin({ code: 1, out: 'ERR^no-callback' }), timeout);
    });
  },
  async _promise(cmd, timeout) {
    try {
      const p = this.K.exec(cmd);
      if (!p || typeof p.then !== 'function') return { code: 1, out: 'ERR^not-promise' };
      const r = await Promise.race([p, new Promise(x => setTimeout(() => x('ERR^timeout'), timeout))]);
      if (r === 'ERR^timeout') return { code: 1, out: 'ERR^timeout' };
      if (typeof r === 'string') return { code: 0, out: r };
      if (r && typeof r === 'object') {
        return {
          code: (r.errno | 0) || (r.code | 0) || 0,
          out: String(r.stdout || '') + String(r.stderr || '') + String(r.output || '')
        };
      }
      return { code: 0, out: String(r == null ? '' : r) };
    } catch (e) { return { code: 1, out: 'ERR ' + e }; }
  },

  async probe() {
    this.probes = [];
    if (!this.detect()) {
      this.execMode = 'demo';
      this.probes.push({ k: '桥对象', v: '未找到 window.ksu / window.kernelsu', ok: false });
      return 'demo';
    }
    this.probes.push({ k: '桥对象', v: 'window.' + (window.ksu ? 'ksu' : 'kernelsu'), ok: true });
    this.probes.push({ k: '桥方法', v: this.keys().join(' ') || '(枚举不出)', ok: true });

    const cands = [
      ['official', (c, t) => this._official(c, t)],
      ['cb', (c, t) => this._cbFn(c, t)],
      ['promise', (c, t) => this._promise(c, t)]
    ];
    for (const [name, fn] of cands) {
      const r = await fn('echo __ksu_probe', 3000);
      const ok = /__ksu_probe/.test(r.out || '');
      this.probes.push({ k: 'exec 形状 · ' + name, v: ok ? '可用' : (r.out || '').slice(0, 60), ok });
      if (ok) { this.execMode = name; break; }
    }
    if (!this.execMode) {
      this.execMode = 'demo';
      this.probes.push({ k: 'exec', v: '三种形状都不可用', ok: false });
      return 'demo';
    }
    try { const r = await this.exec('id -u'); this.isRoot = String(r.out || '').trim() === '0'; } catch (e) { }
    this.probes.push({ k: '权限', v: this.isRoot ? 'root' : '非 root（将尝试 su 包装）', ok: this.isRoot });

    this.iconOk = await new Promise(res => {
      try {
        const im = new Image();
        const t = setTimeout(() => res(false), 900);
        im.onload = () => { clearTimeout(t); res(true); };
        im.onerror = () => { clearTimeout(t); res(false); };
        im.src = 'ksu://icon/com.android.settings';
      } catch (e) { res(false); }
    });
    this.probes.push({ k: '应用图标', v: this.iconOk ? '可用' : '不支持，用首字头像', ok: true });
    return this.execMode;
  },

  async exec(cmd) {
    switch (this.execMode) {
      case 'official': return this._official(cmd, 60000);
      case 'cb': return this._cbFn(cmd, 60000);
      case 'promise': return this._promise(cmd, 60000);
      default: return Demo.exec(cmd);
    }
  },

  _parse(v, fallback) {
    if (v == null) return fallback;
    if (typeof v === 'string') {
      const s = v.trim(); if (!s) return fallback;
      try { return JSON.parse(s); } catch (e) { return fallback; }
    }
    return v;
  },
  listPackages(type) {
    if (!this.has('listPackages')) return null;
    try { const v = this._parse(this.K.listPackages(type || 'all'), null); return Array.isArray(v) ? v : null; }
    catch (e) { return null; }
  },
  async packagesInfo(pkgs) {
    const out = {};
    if (!this.has('getPackagesInfo') || !pkgs.length) return out;
    const STEP = 60;
    for (let i = 0; i < pkgs.length; i += STEP) {
      const slice = pkgs.slice(i, i + STEP);
      let arr = null;
      try { arr = this._parse(this.K.getPackagesInfo(JSON.stringify(slice)), null); } catch (e) { }
      if (!Array.isArray(arr)) { try { arr = this._parse(await this.K.getPackagesInfo(slice), null); } catch (e) { arr = null; } }
      if (Array.isArray(arr)) arr.forEach(o => { if (o && o.packageName) out[o.packageName] = o; });
      await new Promise(r => setTimeout(r, 0));
    }
    return out;
  },
  iconUrl(pkg) { return this.iconOk ? 'ksu://icon/' + pkg : ''; },
  toast(m) { try { if (this.has('toast')) { this.K.toast(String(m)); return true; } } catch (e) { } return false; }
};

/* ============================================================
   2) Api
   ============================================================ */
const Api = {
  shq(s) { return /[^\w@%+=:,./-]/.test(s) ? "'" + String(s).replace(/'/g, "'\\''") + "'" : s; },
  build(cmd) {
    const c = 'sh ' + SCRIPT + ' ' + cmd;
    return Bridge.isRoot ? c : 'su -c ' + this.shq(c);
  },
  async raw(cmd) { return await Bridge.exec(this.build(cmd)); },
  async run(cmd) { const r = await this.raw(cmd); return r.out == null ? '' : r.out; },
  async execRaw(cmd) {
    const c = Bridge.isRoot ? cmd : 'su -c ' + this.shq(cmd);
    const r = await Bridge.exec(c);
    return r.out == null ? '' : r.out;
  },
  _kv(text) {
    const m = {};
    String(text || '').split('\n').forEach(line => {
      const i = line.indexOf('=');
      if (i > 0) m[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return m;
  },
  async status() { return this._kv(await this.run('status')); },
  async modes() { return this._kv(await this.run('mode')); },
  async appmodes() { return this._kv(await this.run('appmodes')); },
  async setAppMode(pkg, mode) { return await this.run('setappmode ' + this.shq(pkg) + ' ' + this.shq(mode)); },
  async importScene() { return await this.run('importscene'); },
  async syncmode() { return await this.run('syncmode'); },
  async freqs() { return this._kv(await this.run('freqs')); },
  async readText(id) {
    const len = parseInt(String(await this.run('b64len ' + this.shq(id))).trim(), 10) || 0;
    if (!len) return '';
    if (len <= 60000) return b64dec(await this.run('b64 ' + this.shq(id) + ' 1 ' + len));
    const STEP = 40000;
    let acc = '';
    for (let off = 1; off <= len; off += STEP) acc += await this.run('b64 ' + this.shq(id) + ' ' + off + ' ' + STEP);
    return b64dec(acc);
  },
  async writeText(id, text) {
    const b64 = b64enc(text);
    // 分块越大，桥调用次数越少（批量套用几百个应用时这是主要延迟来源）
    const STEP = 24000;
    let r = await this.run('wbegin ' + this.shq(id));
    if (!/^OK/m.test(r)) return 'ERR wbegin: ' + r;
    for (let i = 0; i < b64.length; i += STEP) {
      r = await this.run('wappend ' + this.shq(id) + ' ' + b64.slice(i, i + STEP));
      if (!/^OK/m.test(r)) return 'ERR wappend: ' + r;
    }
    return await this.run('wcommit ' + this.shq(id));
  },
  async live() { return await this.run('live'); },
  /* 读 Scene 的 features/<name>.conf（原样 K=V 文本） */
  async conf(name) { return await this.run('conf ' + this.shq(String(name))); },
  /* 游戏页：把 Scene 的 FAS 调速器（features/fas.conf 三簇）统一为 xres */
  async fasxres() { return await this.run('fasxres'); },
  async games() { return await this.run('games'); },
  apps_tpl() { return this.run('apps_tpl'); },
  /* 有前台界面（启动器能点开）的包清单，应用页过滤用 */
  async launchables() { return await this.run('launchables'); },
  /* 只落核指定包：批量套用后立刻生效，比全量快得多 */
  async enforce(pkgs) {
    const a = (pkgs || []).map(p => this.shq(String(p))).join(' ');
    return await this.run('enforcep' + (a ? ' ' + a : ''));
  },
  /* 配置完整性审计 / 一键还原数据 */
  async audit() { return String(await this.run('audit') || ''); },
  async fixall(scheme) {
    return await this.run('fixall' + (scheme ? ' ' + this.shq(String(scheme)) : ''));
  },
  /* 调度配置：传递 / 备份 / 恢复 / 列表 */
  async profilepush() { return await this.run('profilepush'); },
  async profilebackup() { return await this.run('profilebackup'); },
  async profilerestore(name) {
    return await this.run('profilerestore' + (name ? ' ' + this.shq(String(name)) : ''));
  },
  async profilelist() {
    return String(await this.run('profilelist'))
      .split('\n')
      .filter(l => l.indexOf('BK=') === 0)
      .map(l => {
        const p = l.slice(3).split('|');
        const raw = p[0] || '';
        // 20260916_001528 → 2026-09-16 00:15:28
        const lbl = raw.length === 15
          ? raw.slice(0, 4) + '-' + raw.slice(4, 6) + '-' + raw.slice(6, 8) + ' ' +
            raw.slice(9, 11) + ':' + raw.slice(11, 13) + ':' + raw.slice(13, 15)
          : raw;
        return { name: raw, files: parseInt(p[1] || '0', 10) || 0, label: lbl };
      })
      .sort((a, b) => (a.name < b.name ? 1 : -1));   // 最新在前
  },
  async saveSettings(kv) { return await this.writeText('settings', kv); },
  async action(sub, args) {
    const a = (args || []).map(x => this.shq(String(x))).join(' ');
    return await this.run(sub + (a ? ' ' + a : ''));
  }
};

function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec(b64) {
  const clean = (b64 || '').replace(/\s+/g, '');
  if (!clean) return '';
  const bin = atob(clean);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ============================================================
   3) 全局状态
   ============================================================ */
const S = {
  tab: 'overview',
  status: {}, freqs: {}, mode: {},
  model: null,
  apps: [],
  /* 「有前台界面」的包集合（启动器能点开的）。null = 没拿到清单 → 不筛选。
     用途：应用页默认只显示有界面的应用，避免把没有界面的系统服务也拉进来绑核。 */
  launchable: null,
  showHeadless: false,   // 「含无界面」开关：临时显示全部（含系统服务）
  appMode: {},        // pkg → Scene 里指定的模式（'A_<pkg>' 去掉前缀）
  sceneDefault: '',   // Scene 的全局默认模式（powercfg.xml 里的 "*"）
  sceneCount: {},     // 各模式命中多少应用
  // 游戏（Scene 标记）：频率跟随 Scene 对单应用的设置，线程由模板定义
  games: [],          // [{pkg, mode}]
  templates: [],      // [{id, friendly, other}]
  gameAssign: {},     // pkg → template id
  // 应用（非游戏）：线程档位驱动
  appTplLib: [],      // [{id, friendly, other, ...}]
  appTplAssign: {},   // pkg → template id
  ownMode: {},        // pkg → 模式：**只在 Scene 里单独设过**的（powercfg 有显式条目）
                      //   仅用于行内展示「Scene 省电」这种标记，**不再**驱动线程档位
  debug: 1,           // 「记录模块日志」开关（关掉可省掉守护的写盘开销）
  semCores: {},       // 语义占位符 → 实际核号
  sel: new Set(),
  query: '', filter: 'all',
  showCount: 100,
  backups: [],        // [{name, files, label}] —— 调度配置备份列表
  fasGov: null,       // {l,m,p} —— Scene 的 FAS 调速器（features/fas.conf 三簇）当前值
  auditBad: [],       // [{file, cn, why, detail}] —— 配置完整性异常项（注错文件清单）
  auditAt: '',        // 上次审计时间
  ops: [],
  savedAt: '',
  busy: false, demo: false,
  dirty: false, autoApply: true, applying: false,
  bridgeMode: ''
};

const MODE_ORDER = ['powersave', 'balance', 'performance', 'fast'];
const MODE_CN = { powersave: '省电', balance: '均衡', performance: '性能', fast: '极速' };

/* Scene 的「配置来源」（shared_prefs/global.xml → scene_profile_source）。
   它决定 Scene 当前启用的是哪一套配置 —— 也就是「在 Scene 里启用配置」那一步。
   实测：只有 SOURCE_SCENE_ONLINE 既能让调节页显示我们的身份（Scene / 🌍 Version: LP），
   又能通过 Scene 的校验（性能调节可开启）。SOURCE_OUTSIDE 会被判无效，不要用。 */
const SCENE_SRC_CN = {
  SOURCE_SCENE_ONLINE: 'Scene 方案（显示我们的身份、按我们的 profile 下发）✅',
  SOURCE_SCENE_CUSTOM: '自定义通道（能下发，但显示成「自定义」）',
  SOURCE_OUTSIDE:      '外部配置通道（Scene 判为无效，性能调节打不开）',
  SOURCE_NONE:         '未启用任何配置',
};

/* ============================================================
   4) 小工具
   ============================================================ */
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function h(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function debounce(fn, ms) { let t; return function () { clearTimeout(t); const a = arguments; t = setTimeout(() => fn.apply(null, a), ms); }; }
function fmtMHz(v) { const n = parseInt(v, 10); return n ? (n / 1000).toFixed(n % 1000 ? 1 : 0) + 'M' : '—'; }
function stamp() { return new Date().toTimeString().slice(0, 8); }
function logOp(msg) { S.ops.unshift('[' + stamp() + '] ' + msg); if (S.ops.length > 300) S.ops.length = 300; }
function markSaved() { S.savedAt = stamp(); const e = $('saved'); if (e) e.textContent = '已保存 ' + S.savedAt; }
function toast(msg) {
  Bridge.toast(msg);
  const el = $('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2600);
}
function avatarColor(pkg) {
  let n = 0;
  for (let i = 0; i < pkg.length; i++) n = (n * 31 + pkg.charCodeAt(i)) >>> 0;
  const hues = [210, 340, 20, 160, 268, 45, 300, 190];
  return 'hsl(' + hues[n % hues.length] + ',58%,52%)';
}
function shortName(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
async function busy(label, fn) {
  if (S.busy) { toast('上一个操作还没结束'); return null; }

  catch (e) { toast('失败：' + ((e && e.message) || e)); return null; }

}

/* ============================================================
   5) 模型：4 级模式阶梯
   ------------------------------------------------------------
   model = {
     version, globalMode,
     modes: { powersave: { cn, active:{L:[min,max],M,P}, inactive:{...},
                           cpuset:{main_thread,other} }, ... },
     pins:  { pkg: mode },     // 例外表：固定到某模式；其余全部跟随全局
     games: [ 线程级规则 ],
     allPkgs: [ 设备上全部应用 ]
   }
   ============================================================ */
function loadModeTable() {
  // 后端 `mode` 输出：MODE_<name>=<中文>|<active 6值>|<inactive 6值>|<main>|<other>
  const t = {};
  MODE_ORDER.forEach(m => {
    const raw = S.mode['MODE_' + m];
    if (!raw) return;
    const p = String(raw).split('|');
    const af = (p[1] || '').trim().split(/\s+/).map(Number);
    const inf = (p[2] || '').trim().split(/\s+/).map(Number);
    t[m] = {
      cn: p[0] || MODE_CN[m],
      active: { L: [af[0], af[1]], M: [af[2], af[3]], P: [af[4], af[5]] },
      inactive: { L: [inf[0], inf[1]], M: [inf[2], inf[3]], P: [inf[4], inf[5]] }
    };
  });
  return t;
}

function defaultModes() {
  const t = {};
  MODE_ORDER.forEach(m => {
    t[m] = {
      cn: MODE_CN[m],
      active: { L: [417792, 1353600], M: [556800, 1468800], P: [1113600, 2044800] },
      inactive: { L: [417792, 1065600], M: [556800, 1142400], P: [1113600, 2044800] }
    };
  });
  return t;
}

async function loadModel() {
  const raw = await Api.readText('model');
  if (raw && raw.trim()) {
    try {
      const m = JSON.parse(raw);
      if (m && m.modes && m.pins !== undefined) {
        if (!m.games) m.games = [];
        if (!m.deny) m.deny = [];
        S.model = m;
        return m;
      }
    } catch (e) { logOp('model.json 解析失败，按设备状态重建'); }
  }
  const table = loadModeTable();
  S.model = {
    version: 3,
    globalMode: S.mode.MODE || 'balance',
    modes: Object.keys(table).length ? table : defaultModes(),
    pins: {}, games: [], deny: [], allPkgs: []
  };
  await saveModelNow();
  return S.model;
}

function globalMode() { return (S.model && S.model.globalMode) || 'balance'; }

/* 配置完整性审计结果解析（后端 integrity.sh audit 的 K=V 输出）
   BAD=<文件>|<用途>|<问题类型>|<详细说明>   一行一项
   其余 SCHEME / CHECKED / BAD_N / PRESET_N 等是汇总信息。 */
function parseAudit(raw) {
  const out = { bad: [], scheme: '', checked: 0, presetN: 0 };
  String(raw || '').split('\n').forEach(line => {
    line = line.trim(); if (!line) return;
    const i = line.indexOf('='); if (i < 0) return;
    const k = line.slice(0, i), v = line.slice(i + 1);
    if (k === 'BAD') {
      const p = v.split('|');
      out.bad.push({ file: p[0] || '', cn: p[1] || '', why: p[2] || '异常', detail: p[3] || '' });
    } else if (k === 'SCHEME') out.scheme = v;
    else if (k === 'CHECKED') out.checked = parseInt(v, 10) || 0;
    else if (k === 'PRESET_N') out.presetN = parseInt(v, 10) || 0;
  });
  return out;
}

/* 模式页的频率必须**显示/编辑 Scene 真正会下发的那份** ——
   profile.json 里 <mode>_active / <mode>_inactive 的 @cpu_freq（cpu0/cpu4/cpu8）。
   设备端 mode_freq() 只是内置兜底表；若拿它渲染，用户改了看不见、看到的也不是实际生效值。
   → 用户在 Scene 里把某应用切成省电/均衡/性能/极速时，用的就是这里显示/编辑的频率。 */
async function loadModeFreqFromScene() {
  if (!S.model || !S.model.modes) return 0;
  let raw = '';
  try { raw = await Api.readText('profile'); } catch (e) { return 0; }
  if (!raw || !raw.trim()) return 0;
  let d; try { d = JSON.parse(raw); } catch (e) { logOp('profile.json 解析失败，频率沿用内置兜底表'); return 0; }
  const pr = (d && d.presets) || {};
  const CL = { cpu0: 'L', cpu4: 'M', cpu8: 'P' };
  let n = 0;
  MODE_ORDER.forEach(md => {
    const t = S.model.modes[md]; if (!t) return;
    ['active', 'inactive'].forEach(st => {
      const body = pr[md + '_' + st];
      if (!Array.isArray(body) || !t[st]) return;
      body.forEach(it => {
        if (!Array.isArray(it) || it[0] !== '@cpu_freq') return;
        const cl = CL[it[1]];
        const mn = parseInt(it[2], 10), mx = parseInt(it[it.length - 1], 10);
        if (!cl || !mn || !mx) return;
        t[st][cl] = [mn, mx];
        n++;
      });
    });
  });
  if (n) logOp('模式频率已读自 Scene 的 profile.json（' + n + ' 条 @cpu_freq）');
  return n;
}

/** 把模式阶梯同步进 Scene 的 profile.json（8 组 <mode>_active/inactive 的 @cpu_freq） */
async function pushPresetsToScene() {
  const raw = await Api.readText('profile');
  if (!raw || !raw.trim()) return 'ERR 读不到 profile.json';
  let d; try { d = JSON.parse(raw); } catch (e) { return 'ERR profile.json 解析失败'; }
  const presets = d.presets || (d.presets = {});
  const MAP = { cpu0: 'L', cpu4: 'M', cpu8: 'P' };
  let n = 0;
  MODE_ORDER.forEach(md => {
    const t = S.model.modes[md]; if (!t) return;
    ['active', 'inactive'].forEach(st => {
      const body = presets[md + '_' + st];
      if (!Array.isArray(body)) return;
      body.forEach(it => {
        if (Array.isArray(it) && it[0] === '@cpu_freq' && MAP[it[1]] && t[st] && t[st][MAP[it[1]]]) {
          const v = t[st][MAP[it[1]]];
          it[2] = String(v[0]);
          it[it.length - 1] = String(v[1]);
          n++;
        }
      });
    });
  });
  if (!n) return 'ERR 没找到任何 @cpu_freq 条目（profile.json 结构异常）';
  const r = await Api.writeText('profile', JSON.stringify(d, null, 2));
  return /^OK/m.test(r) ? 'OK 已更新 ' + n + ' 条 @cpu_freq' : 'ERR ' + r;
}

/* ============================================================
   底部选择器（轻量，无依赖）。opts = [{v, label, hint, on}]
   点的位置：应用行的「Scene 模式」标签 / 「线程档位」标签。
   ============================================================ */
/* 底部选择器的「取消」哨兵值。
   ⚠ 原来用的是 NUL 开头那串 —— NUL 一旦进 HTML 属性（innerHTML 后再解析），
     按 HTML 规范会被替换成 U+FFFD，于是 getAttribute() 拿回的是 "\uFFFDcancel"，
     跟哨兵**永远不相等** → 点「取消」会把这个乱码值当成档位/模式回调下去。
     实测后果：点应用行线程档位的「取消」→ app_assign.tsv 被写成 "pkg<TAB>\uFFFDcancel"；
     点 Scene 模式选择器的「取消」同理会把乱码模式写进 Scene。
     换成一个不与任何档位 id 冲突的普通字符串即可。 */
const PICK_CANCEL = '__cancel__';

function pickSheet(title, opts, cb) {
  let el = $('picksheet');
  if (!el) {
    el = document.createElement('div');
    el.id = 'picksheet'; el.className = 'pickmask';
    document.body.appendChild(el);
  }
  const close = () => { el.classList.remove('on'); el.innerHTML = ''; el.onclick = null; };
  el.innerHTML = '<div class="pickbox"><div class="pickt">' + esc(title) + '</div>' +
    opts.map(o => '<button class="picki' + (o.on ? ' on' : '') + '" data-pv="' + esc(o.v) + '">' +
      esc(o.label) + (o.hint ? '<span class="pickh">' + esc(o.hint) + '</span>' : '') +
      '</button>').join('') +
    '<button class="picki cancel" data-pv="' + PICK_CANCEL + '">取消</button></div>';
  el.classList.add('on');
  el.onclick = e => {
    const b = e.target.closest ? e.target.closest('[data-pv]') : null;
    if (!b) { if (e.target === el) close(); return; }
    const v = b.getAttribute('data-pv');
    close();
    if (v !== PICK_CANCEL) cb(v);
  };
}

/* ⚠ 单应用的这两个动作都走「乐观更新 + 后台写盘」：
   先改本地状态并 updateAppList()（增量刷列表 + 筛选项计数，毫秒级），
   再在后台把改动写下去。这样点标签是**立刻**有反馈的，
   不会像以前那样弹个阻塞遮罩、等写盘 + 重建 + 落核全跑完才能动。 */

/* 进程级条目（Scene 的 powercfg.xml 里带 ":" 的键，如 com.tencent.mm:appbrand）
   合并进应用清单，让它们能被勾选、套模板。
   ⚠ 标签用「基包名 + 后缀」拼，并对已知后缀给中文名（appbrand = 小程序）。 */
const SUFFIX_CN = {
  appbrand: '小程序', push: '推送', remote: '远程', service: '服务',
  tools: '工具', wxa: '小程序', sandbox: '沙箱', uimain: '界面'
};
function mergeAppExtras() {
  const ex = S.appExtras || [];
  if (!ex.length) return 0;
  const have = {};
  (S.apps || []).forEach(a => { have[a.pkg] = 1; });
  const base = {};
  (S.apps || []).forEach(a => { base[a.pkg] = a.label; });
  let n = 0;
  ex.forEach(e => {
    if (!e.pkg || have[e.pkg]) return;
    const i = e.pkg.indexOf(':');
    const bp = e.pkg.slice(0, i), sfx = e.pkg.slice(i + 1);
    const bt = base[bp] || bp;
    const label = bt + ' · ' + (SUFFIX_CN[sfx] || sfx);
    S.apps.push({ pkg: e.pkg, label: label, hasLabel: true, isSystem: false,
      icon: Bridge.iconUrl(bp), isProc: true });
    have[e.pkg] = 1; n++;
  });
  if (n) {
    S.apps.sort((a, b) => {
      if (a.hasLabel !== b.hasLabel) return a.hasLabel ? -1 : 1;
      return String(a.label).localeCompare(String(b.label), 'zh');
    });
  }
  return n;
}

/* ============================================================
   7) 应用清单
   ============================================================ */
async function loadApps() {
  // ⚠ 取「KSU 桥的包列表」∪「后端 cmd_apps 的包列表」：
  //   桥的口径可能比后端窄（少系统应用），只用桥会让「全部」漏掉应用，
  //   用户就没法给它们套线程档位了。
  let pkgs = Bridge.listPackages('all') || [];
  try {
    const o = await Api.run('apps');
    const back = String(o).split('\n').map(s => s.trim()).filter(Boolean);
    if (back.length) pkgs = pkgs.concat(back);
  } catch (e) { }
  pkgs = [...new Set(pkgs)].filter(p =>
    p && p !== 'android' && !/(overlay|\.rro|auto_generated|shared_library)/.test(p));
  const info = await Bridge.packagesInfo(pkgs);
  const FB = (typeof FALLBACK_LABELS === 'object' && FALLBACK_LABELS) || {};
  S.apps = pkgs.map(p => {
    const i = info[p];
    const label = (i && (i.appLabel || i.label || i.name)) || FB[p] || '';
    return { pkg: p, label: label || p, hasLabel: !!label, isSystem: i ? !!i.isSystem : false, icon: Bridge.iconUrl(p) };
  });
  S.apps.sort((a, b) => {
    if (a.hasLabel !== b.hasLabel) return a.hasLabel ? -1 : 1;
    return String(a.label).localeCompare(String(b.label), 'zh');
  });
  mergeAppExtras();
  // 拉一次「有前台界面」的包清单：应用页默认只显示这些（见 manualApps）。
  // 失败/为空 → 置 null = 不筛选（老系统没有 query-activities 也不会让列表变空）。
  try {
    const t = String(await Api.launchables() || '').trim();
    const ls = t.split('\n').map(s => s.trim()).filter(Boolean);
    S.launchable = ls.length ? new Set(ls) : null;
  } catch (e) { S.launchable = null; }
  logOp('已载入 ' + S.apps.length + ' 个应用（带名称 ' + S.apps.filter(a => a.hasLabel).length + ' 个' +
    (S.launchable ? '，其中有前台界面 ' + S.launchable.size + ' 个' : '，未能取到界面清单 → 不筛选') + '）');
  return S.apps;
}

/* 系统相机：线程**固定「系统接管」**、用户不允许调整
   → 干脆整块配置入口都隐藏：列表、筛选项计数、批量套用、全选一律不含它。
   ⚠ 前缀与 util.sh 的 CAMERA_GLOB / CAMERA_RE 一致；落核侧（enforce_threads.sh）
     还有一道兜底，所以就算分配表里残留了相机条目也不会被绑核。 */
function isCamera(pkg) {
  return /^com\.android\.camera|^com\.xiaomi\.camera/.test(String(pkg || ''));
}

/* 游戏判断：Scene 标记为游戏的应用不进「应用」页 */
function isGame(pkg) {
  const gs = S.games || [];
  for (let i = 0; i < gs.length; i++) if (gs[i].pkg === pkg) return true;
  return false;
}

/* 游戏（Scene 标记）+ 模板：频率跟随 Scene 对单应用的模式，线程由模板决定。
   解析后端 cmd_games 输出：GAME= / ASSIGN= / TPL= / SEM_= 四组行。 */
async function loadSceneGames() {
  const text = await Api.games();
  const games = [], assign = {}, templates = [], sem = {};
  String(text).split('\n').forEach(line => {
    if (!line) return;
    if (line.indexOf('GAME=') === 0) {
      const t = line.slice(5).split('\t');
      if (t[0]) games.push({ pkg: t[0], mode: t[1] || '' });
    } else if (line.indexOf('ASSIGN=') === 0) {
      const t = line.slice(7).split('\t');
      if (t[0] && t[1]) assign[t[0]] = t[1];
    } else if (line.indexOf('TPL=') === 0) {
      const t = line.slice(4).split('|');
      if (t[0]) templates.push({ id: t[0], friendly: t[1] || t[0], other: t[2] || '',
        heaviest_thread: t[3] || '', heaviest_cores: t[4] || '',
        heavy_thread: t[5] || '', heavy_cores: t[6] || '', comm: t[7] || '' });
    } else if (line.indexOf('EXTRA=') === 0) {
      // 进程级条目（如 com.tencent.mm:appbrand = 微信小程序）：
      // 不是已安装包，但 enforce_threads.sh 按进程名匹配，能真正生效。
      const t = line.slice(6).split('\t');
      if (t[0]) extras.push({ pkg: t[0], mode: t[1] || '' });
    } else if (line.indexOf('CPU_ONLINE=') === 0) {
      sem.__online = line.slice(11);
    } else if (line.indexOf('SEM_') === 0) {
      const t = line.slice(4).split('=');
      if (t[0]) sem[t[0]] = (t[1] || '').split('|')[0];
    }
  });
  S.games = games; S.gameAssign = assign; S.templates = templates; S.semCores = sem;
  logOp('已载入 ' + games.length + ' 个 Scene 游戏，' + templates.length + ' 个线程档位');
  return { games, assign, templates, sem };
}

/* 展开语义占位符 {p1_core} 等为本机实际核号（Aether_OptExt 同款思路） */
function resolveSem(s) {
  if (!s) return '';
  return String(s).replace(/\{[a-z0-9_]+\}/g, m =>
    (S.semCores && S.semCores[m.slice(1, -1)]) || m);
}

/* 应用（非游戏）线程档位：频率跟随 Scene 对单应用的模式，线程由模板决定。
   解析后端 cmd_apps_tpl 输出：APP= / ASSIGN= / TPL= / SEM_= 四组行。 */
async function loadAppsTpl() {
  const text = await Api.apps_tpl();
  const assign = {}, templates = [], sem = {}, extras = [];
  String(text).split('\n').forEach(line => {
    if (!line) return;
    if (line.indexOf('APP=') === 0) {
      const t = line.slice(4).split('\t');
      if (t[0]) S.appMode[t[0]] = t[1] || '';   // 顺带刷新模式映射（覆盖 loadSceneModes）
    } else if (line.indexOf('ASSIGN=') === 0) {
      const t = line.slice(7).split('\t');
      if (t[0] && t[1]) assign[t[0]] = t[1];
    } else if (line.indexOf('TPL=') === 0) {
      const t = line.slice(4).split('|');
      if (t[0]) templates.push({ id: t[0], friendly: t[1] || t[0], other: t[2] || '',
        heaviest_thread: t[3] || '', heaviest_cores: t[4] || '',
        heavy_thread: t[5] || '', heavy_cores: t[6] || '', comm: t[7] || '' });
    } else if (line.indexOf('CPU_ONLINE=') === 0) {
      sem.__online = line.slice(11);
    } else if (line.indexOf('SEM_') === 0) {
      const t = line.slice(4).split('=');
      if (t[0]) sem[t[0]] = (t[1] || '').split('|')[0];
    }
  });
  S.appTplAssign = assign; S.appTplLib = templates; S.semCores = sem;
  S.appExtras = extras;
  mergeAppExtras();
  logOp('已载入应用线程档位：' + templates.length + ' 个，已分配 ' + Object.keys(assign).length +
    ' 个应用，进程级条目 ' + extras.length + ' 个');
  return { assign, templates, sem };
}

/* 写 app_assign.tsv 并重建 threads.json（模板驱动） */
async function saveAppAssign(tsv) {
  const t0 = Date.now();
  const r = await busy('正在保存并生效…', async () => {
    const w = await Api.writeText('appassign', tsv);
    if (!/^OK/m.test(String(w))) return 'ERR 写入失败：' + w;
    return await Api.syncmode();
  });
  logOp('保存耗时 ' + (Date.now() - t0) + 'ms');
  S.appTplAssign = {};
  String(tsv).split('\n').forEach(line => { const f = line.split('\t'); if (f[0] && f[1]) S.appTplAssign[f[0]] = f[1]; });
  logOp('✅ 应用线程档位已保存：' + String(r || '').slice(0, 80));
  toast(/ERR/.test(String(r || '')) ? String(r).slice(0, 90) : '已保存并重建');
  // ⚠ 不再 refreshAll()：那会重读 status / apps_tpl / appmodes（数秒）并整页重渲染，
  //   是「套用模板很卡」的主因。分配状态已在本地，直接重渲染即可。
  render();
}
/* 把「已选」套到某个档位（kind='app'|'game'）；tplId 为空 = 取消分配。
   应用页与游戏页共用这一条路径：勾选在列表里做，模板在模板卡上点。 */
async function applySelected(kind, tplId) {
  if (!S.sel.size) { toast('先在下面勾选应用'); return; }
  const isGameKind = kind === 'game';
  const map = isGameKind ? S.gameAssign : S.appTplAssign;
  const n = S.sel.size;
  for (const p of S.sel) { if (tplId) map[p] = tplId; else delete map[p]; }
  S.sel.clear();
  if (isGameKind) { await actGameAssignSave('mem'); return; }
  await saveAppAssign(Object.keys(map).map(p => p + '\t' + map[p]).join('\n'));
  toast('已' + (tplId ? '套用档位' : '取消分配') + '：' + n + ' 个应用');
}

/* ---------- 应用只有一个列表 ----------
   所有非游戏应用都在同一个列表里，都能被勾选、套模板。
   「在 Scene 里单独设过模式」的应用**不再**单独成列表（用户要求：合并）——
   它们只是多显示一个「Scene 模式」标记，套用模板时没有任何特殊待遇。
   ⚠ hasOwnMode 用 ownMode（Scene 里**显式设过**的条目）而不是 appMode：
     appMode 是「生效模式」，后端会给每个已安装应用都填上（没单独设的填全局默认）。
   游戏单独在「游戏」页。
   ⚠ v10：`ownMode` 只用于**展示**「Scene 省电」这样的标记，不再参与档位推导。 */
function hasOwnMode(pkg) { return !!(S.ownMode && (pkg in S.ownMode)); }
function manualApps() {
  // 游戏去「游戏」页；相机固定「系统接管」、不给配置入口 —— 两者都不出现在应用页
  let list = (S.apps || []).filter(a => !isGame(a.pkg) && !isCamera(a.pkg));
  // ★ 默认只留「有前台界面」的应用（启动器里能点开的）。
  //   本机 487 个已装包里只有 169 个能点开，其余多是 xxx.provider / xxx.service 这类
  //   没界面的系统服务 —— 给它们绑核既没意义，还可能把系统服务限制坏（用户要求）。
  //   · S.launchable 为 null（后端拿不到清单）→ 不筛，宁可多显示，不能让列表变空
  //   · 已经设过档位的包**照常显示** —— 否则老分配会变成「看不见但还在生效」，没法撤
  if (S.launchable && !S.showHeadless) {
    list = list.filter(a => S.launchable.has(a.pkg) || !!effTpl(a.pkg));
  }
  return list;
}

/* 被「无界面」规则挡掉的包数（给标题行显示用，避免用户以为应用丢了） */
function headlessHiddenCount() {
  if (!S.launchable || S.showHeadless) return 0;
  return (S.apps || []).filter(a =>
    !isGame(a.pkg) && !isCamera(a.pkg) && !S.launchable.has(a.pkg) && !effTpl(a.pkg)).length;
}

/* 档位显示名。档位 id 与模式同名，显示名直接用模式的中文名（省电/均衡/性能/极速）。 */
function tplName(id) {
  if (!id) return '未设置';
  const t = (S.appTplLib || []).find(x => x.id === id) ||
            (S.templates || []).find(x => x.id === id);
  if (t) return t.friendly;
  return MODE_CN[id] || id;
}

/* 档位 → 「核位摘要」，给档位选择器和档位卡当副标题用。
   resolveSem 把 {p1_core} 这类占位符展开成真实核号（如 4-7）。
   目的：让用户在**手动选档位**时一眼看清这个档位会怎么绑，而不是只看到一个名字。 */
function tplHint(t) {
  const oc = resolveSem(t.other);
  const hc = resolveSem(t.heaviest_cores);
  const ec = resolveSem(t.heavy_cores);
  // 核位 + comm 全空 = 「系统接管」档：不写任何亲和性
  if (!oc && !hc && !ec && !t.comm) return '不写线程亲和性 · 交回系统调度器';
  const parts = [];
  if (hc) parts.push('主线程 ' + hc);
  if (ec) parts.push((t.heavy_thread || '重载线程') + ' ' + ec);
  if (oc) parts.push('其余 ' + oc);
  if (t.comm) parts.push(t.comm.replace(/;/g, '，'));
  return parts.join(' · ');
}

/* 某个包**实际生效**的线程档位。
   v10：档位就是 app_assign.tsv / game_assign.tsv 里的值 —— **模块自持**。
   旧版有个「Scene 模式 → 模板」的实时覆盖，副作用很大：Scene 把
   com.android.camera 这类包设成 fast 后映射为空，那些包会从落核目标表里
   彻底消失，界面上却仍显示「已套高性能」，实际一条 taskset 都没发。
   现在要跟 Scene 对齐只能显式点「从 Scene 导入一次」。 */
function effTpl(pkg) { return (S.appTplAssign || {})[pkg] || ''; }

/* 非游戏应用「实际生效」的档位表 pkg → 档位id（档位卡统计要用） */
function effAssignMap() {
  const m = {};
  manualApps().forEach(a => { const t = effTpl(a.pkg); if (t) m[a.pkg] = t; });
  return m;
}

/* 按模板筛选：S.filter = 'all' | 'tpl:<id>' | 'none' */
function tplMatch(map, pkg) {
  const cur = effTpl(pkg);
  if (S.filter === 'none') return !cur;
  if (S.filter.indexOf('tpl:') === 0) return cur === S.filter.slice(4);
  return true;
}
function filterApps() {
  const terms = S.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list = manualApps().filter(a => tplMatch(S.appTplAssign || {}, a.pkg));
  if (terms.length) list = list.filter(a => {
    const hay = (a.label + ' ' + a.pkg).toLowerCase();
    return terms.every(t => hay.indexOf(t) >= 0);
  });
  return list;
}

/* 手动列表总数 / 其中已配模板数 */
function appTotalCount() { return manualApps().length; }
function tplAssignedCount() {
  let n = 0;
  manualApps().forEach(a => { if (effTpl(a.pkg)) n++; });
  return n;
}
/* 紧凑单行：勾选 + 图标 + 名称/包名 + 当前模板（一屏显示更多应用）。
   ⚠ 这里刻意不放任何下拉：模板在「模板卡」上选，应用只负责被勾选。 */
function appRowHtml(a) {
  const tpl = effTpl(a.pkg);
  const sel = S.sel.has(a.pkg);

/* 档位卡：档位信息 + 「套用到所选」。
   kind = app | game，决定动作名（appapply / gameapply）与「已配 N」的统计源。 */
/* 模板卡。
   · kind = app | game（决定动作名 appapply / gameapply 与统计源）
   · v12 起**没有「不接管」伪卡**（用户要求删除）；未设置的包只在筛选条里计数。
   · 详情（其余/最重/次重/comm）默认**不显示**，点模板名才弹小窗，点空白处收起。 */
function tplCardHtml(t, kind, map, countMap) {
  const oc = resolveSem(t.other);
  const hc = resolveSem(t.heaviest_cores);
  const ec = resolveSem(t.heavy_cores);
  /* 「系统接管」档：核位全空 = 不写任何线程亲和性。
     它没有核位可展示，但 ⓘ 必须仍能弹出说明（否则点了没反应）→ 单独给一段文案。 */
  const isFree = !oc && !hc && !ec && !t.comm;
  // countMap = 实际生效表（应用页传 effAssignMap()）；不传就退回手动表（游戏页）
  const src = countMap || map;
  const n = (typeof t.count === 'number')
    ? t.count
    : Object.keys(src).filter(p => src[p] === t.id).length;
  const detail =
    (oc ? '<span class="tpl-p">其余 → ' + esc(oc) + '</span>' : '') +
    (hc ? '<span class="tpl-p">最重 ' + esc(t.heaviest_thread) + ' → ' + esc(hc) + '</span>' : '') +
    (ec ? '<span class="tpl-p">次重 → ' + esc(ec) + '</span>' : '') +
    (t.comm ? '<span class="tpl-p">comm → ' + esc(resolveSem(t.comm).replace(/;/g, '，')) + '</span>' : '') +
    (isFree
      ? '<span class="tpl-p">不写入任何线程亲和性 —— 全部线程交回系统调度器</span>' +
        '<span class="tpl-p">主线程 / 渲染 / 其余线程都不绑，新起的线程、新进程也不干预</span>' +
        '<span class="tpl-p">由内核 core_ctl 与厂商 power HAL 自行决定何时上超大核</span>' +
        '<span class="tpl-p">从其它档位切到本档时，会主动解绑一次旧绑定</span>'
      : '');

  /* 标题行 = [模板名 ⓘ] + id 徽标 + 已配计数 +「套用」按钮，全部一行。
     ⚠ 两个约束：
       1)「套用」必须直接挂在 .tpl-h 下（不能包 .btn-row）：
          .btn-row .btn { flex:1; min-width:108px } 会把它撑满整行，就回到两行了。
       2) 名称与 ⓘ 必须包在同一个 .tpl-n 里：ⓘ 若作为 .tpl-h 的直接子元素，
          会被 .tpl-h 的 gap 均分间距，看起来「飘在名称和徽标中间」；
          包起来后 ⓘ 紧贴名称右缘跟随（用户要求「感叹号紧跟模式名称后面」）。 */
  const head =
    '<div class="tpl-h">' +
    '<span class="tpl-n">' +
    '<span class="n" data-act="tpltips">' + esc(t.friendly) + '</span>' +
    '<span class="tpl-i" data-act="tpltips" title="查看模板说明">i</span>' +
    '</span>' +
    '<span class="pill">' + esc(t.id) + '</span>' +
    '<span class="pill' + (n ? ' accent' : '') + '">已配 ' + n + '</span>' +
    '<button class="btn primary btn-xs tpl-apply" data-act="' + kind + 'apply" data-arg="' +
    esc(t.id) + '">套用</button>' +
    '</div>';

  /* 详情面板**内联**在卡片里（不再绝对定位）：
     原来是 position:absolute + top:41px，内容一多就超出卡片下边界被 .card 的
     overflow:hidden 裁掉（用户报「超出部分看不见」）。
     改成普通流式块后由卡片自己撑高，不再有裁切问题。 */
  return '<div class="tpl" data-tpl="' + esc(t.id) + '">' +
    head +
    (detail ? '<div class="tpl-b">' + detail + '</div>' : '') +
    '</div>';
}

/* 图标懒加载：ksu://icon/<pkg> 每个都要管理器解一次图标，一次性取几十上百个会卡死。
   只给「快进入视口」的行取。 */
let _icoIO = null;
function loadIconsInList() {
  const box = $('applist'); if (!box) return;
  const imgs = box.querySelectorAll('img[data-ico]');
  if (!imgs.length) return;
  if (typeof IntersectionObserver !== 'function') {
    imgs.forEach(im => { im.src = 'ksu://icon/' + im.getAttribute('data-ico'); im.removeAttribute('data-ico'); });
    return;
  }
  if (_icoIO) _icoIO.disconnect();
  _icoIO = new IntersectionObserver((es, ob) => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const im = e.target, p = im.getAttribute('data-ico');
      if (p) { im.src = 'ksu://icon/' + p; im.removeAttribute('data-ico'); }
      ob.unobserve(im);
    });
  }, { root: box, rootMargin: '280px' });
  imgs.forEach(im => _icoIO.observe(im));
}

function updateFilterChips() {

    const hid = headlessHiddenCount();
    c.textContent = filterApps().length + ' 个应用' +
      (S.query ? ' · 搜索「' + S.query + '」' : '') +

}

async function actSyncMode(silent) {
  const r = await busy('正在重建线程分配…', () => Api.syncmode());
  const line = String(r || '').trim().split('\n').filter(Boolean).pop() || '';
  logOp((/^OK/.test(line) ? '✅ ' : '❌ ') + line);
  if (!silent) toast(line.slice(0, 90) || '已同步');
  await refreshStatus();
  render();
  return line;
}

/** 保存模式阶梯：model + modes.conf + profile.json 的 preset，然后重建 threads */
async function actSaveModes() {
  const r = await busy('正在下发模式阶梯…', async () => {
    if (!await saveModelNow()) return 'ERR 保存模型失败';
    const p = await pushPresetsToScene();
    const lv = await Api.live();
    return [p, String(lv).trim()].join(' ／ ');
  });
  S.dirty = false;
  logOp('▶ 模式阶梯已下发：' + String(r || '').slice(0, 120));
  const bad = /ERR/.test(String(r || ''));
  toast(bad ? String(r).slice(0, 90) : '模式已下发');
  await refreshStatus(); render();
}

/* 游戏档位分配：下拉或 TSV 直编，写入 game_assign.tsv 后重建 threads.json 并落核 */
async function actGameAssignSave(src) {
  let tsv;
  if (src === 'tsv') {
    const e = $('game-assign'); if (!e) return;
    tsv = e.value.replace(/\r/g, '').split('\n').map(s => s.trim()).filter(Boolean).join('\n');
    for (const line of tsv.split('\n')) {
      const f = line.split('\t');
      if (f.length < 2 || !f[0] || !f[1]) { toast('每行需 包名<TAB>模板id'); return; }
    }
    S.gameAssign = {};
    tsv.split('\n').forEach(line => { const f = line.split('\t'); if (f[0] && f[1]) S.gameAssign[f[0]] = f[1]; });
  } else {
    tsv = Object.keys(S.gameAssign).map(p => p + '\t' + S.gameAssign[p]).join('\n');
  }
  const r = await busy('正在保存并重建…', async () => {
    const w = await Api.writeText('gameassign', tsv);
    if (!/^OK/m.test(String(w))) return 'ERR 写入失败：' + w;
    return await Api.syncmode();
  });
  logOp('✅ 游戏线程分配已保存：' + String(r || '').slice(0, 80));
  toast(/ERR/.test(String(r || '')) ? String(r).slice(0, 90) : '已保存并重建');
  render();
}

  freqdefaults: () => {

/* 切页签：必须清空勾选集合。
   ⚠ S.sel 是跨页共享的，曾经出现「应用页点全选 → 切到游戏页点套用」
     把几百个普通应用写进 game_assign.tsv 的事故（脏数据会让模式同步整体失效）。 */
function switchTab(a) {
  if (a !== S.tab) S.sel.clear();
  S.tab = a;
  S.showCount = 100;
  render();
  window.scrollTo(0, 0);
  // 兜底：应用页依赖 apps_tpl（模板卡 + 筛选项计数）。若还没到就补拉一次再重渲染，
  // 否则会出现「档位卡空白、筛选项只有『全部 0 / 未设置 0』」。
  if (a === 'apps' && !(S.appTplLib || []).length) {
    loadAppsTpl().then(() => { if (S.tab === 'apps') render(); }).catch(() => { });
  }
  // ★ 每次进应用页都重读一次 Scene 的单应用模式：
  //   ownMode 只在启动/手动刷新时加载过，用户在 Scene 里改了模式再回来就会是旧的 ——
  //   表现就是「明明设成性能了，标签和筛选还留在流畅日常」。
  if (a === 'apps') {
    loadSceneModes().then(() => { if (S.tab === 'apps') render(); }).catch(() => { });
  }
}

/* 开关共用 settings.conf：改写一个时必须带上另一个的现值，否则会被清掉 */
async function settingsText(key, val) {
  const cur = await Api.readText('settings');
  const kv = {};
  String(cur || '').split('\n').forEach(l => {
    const i = l.indexOf('='); if (i > 0) kv[l.slice(0, i).trim()] = l.slice(i + 1).trim();
  });
  // 缺省值：与 util.sh settings_load 的默认保持一致
  if (!('debug' in kv)) kv.debug = '1';
  kv[key] = String(val);
  // v10 起 settings.conf 只有 debug 一个键：
  //   · freq_sync —— 频率恒由 Scene 下发，模块不写任何频率节点
  //   · mode_sync —— 档位改为模块自持，只在用户点「从 Scene 导入」时对齐一次
  // 历史文件里残留的这两个键会被 util.sh 的 settings_load 忽略；这里也不再写回，
  // 写了只会让「模块描述」和界面状态互相矛盾。
  return ['debug'].map(k => k + '=' + kv[k]).join('\n') + '\n';
}

function clickHandler(ev) {
  const t = ev.target;
  const actEl = t.closest ? t.closest('[data-act]') : null;
  if (actEl) {
    const fn = ACTIONS[actEl.getAttribute('data-act')];
    if (fn) { ev.preventDefault(); ev.stopPropagation(); fn(actEl.getAttribute('data-arg'), actEl); return; }
  }
  const fEl = t.closest ? t.closest('[data-filter]') : null;
  // 筛选只增量刷列表（整页 render 会重建搜索框并重载全部图标 → 卡）
  if (fEl) {
    S.filter = fEl.getAttribute('data-filter'); S.showCount = 100;
    if (S.tab === 'games') render(); else updateAppList();
    return;
  }
}

const INPUT_HANDLER = async ev => {
  const t = ev.target;
  if (t.id === 'q') {
    // ⚠ 不整页 render：应用页只增量刷列表（不丢焦点）；游戏页数量少，直接重渲染即可
    S.query = t.value; S.showCount = 100;
    clearTimeout(window._qt);
    window._qt = setTimeout(() => { if (S.tab === 'games') render(); else updateAppList(); }, 140);
    return;
  }

  // 模式页：频率 min/max 下拉（data-mf = 模式:状态:簇:0=min|1=max）
  // v9：重新开放编辑 —— 改完点「保存并下发」会写进 Scene 的 profile.json preset。
  if (t.dataset && t.dataset.mf) {
    const p = String(t.dataset.mf).split(':');
    const md = S.model && S.model.modes && S.model.modes[p[0]];
    const row = md && md[p[1]];
    if (!row || !row[p[2]]) return;
    const v = row[p[2]];
    const i = p[3] === '1' ? 1 : 0;
    const nv = parseInt(t.value, 10);
    if (!isFinite(nv)) return;
    v[i] = nv;
    if (v[0] > v[1]) {          // min > max 时把另一端顶过去，避免下发非法区间
      if (i === 0) v[1] = v[0]; else v[0] = v[1];
      render();
    }
    markDirty();
    return;
  }

  // 日志页：模块日志开关（控功耗）
  if (t.id === 'dbg') {
    const on = t.checked ? 1 : 0;
    await busy(on ? '正在开启…' : '正在关闭…', async () => {
      const w = await Api.saveSettings(await settingsText('debug', on));
      if (!/^OK/m.test(String(w))) { toast('写入失败：' + String(w).slice(0, 60)); return; }
      S.debug = on;
      await refreshStatus();
    });
    logOp(on ? '✅ 已开启模块日志' : '✅ 已关闭模块日志（省功耗）');
    toast(on ? '已开启：守护会写日志' : '已关闭：守护不再写盘');
    render();
    return;
  }
  // 应用 / 游戏：勾选（只改这一行 + 计数，不重渲染）
  if (t.hasAttribute && t.hasAttribute('data-sel')) {
    const p = t.getAttribute('data-sel');
    if (t.checked) S.sel.add(p); else S.sel.delete(p);
    const sc = $('selcount'); if (sc) sc.textContent = S.sel.size;
    const row = t.closest ? t.closest('.app-row') : null;
    if (row) row.classList.toggle('sel', t.checked);
    return;
  }
};

async function boot() {
  const tabs = document.querySelector('.tabs');
  if (tabs) {
    tabs.addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      switchTab(b.getAttribute('data-tab'));
    });
  }
  document.addEventListener('click', clickHandler);
  // 点空白（或任何非说明入口的地方）收起模板详情小窗。
  // ⚠ 这里必须把**两个** ⓘ 入口都放过：
  //   data-act="tpltips"（卡上的）与 data-act="tpltipsall"（标题行上的）。
  //   漏掉后者的话，标题 ⓘ 刚把全部展开，就被本监听器当场收起（表现为「点了没反应」）。
  document.addEventListener('click', ev => {
    const t = ev.target;
    if (t && t.closest && (t.closest('.tpl-b') || t.closest('[data-act="tpltips"]') ||
        t.closest('[data-act="tpltipsall"]'))) return;
    document.querySelectorAll('.tpl.tips').forEach(x => x.classList.remove('tips'));
  });
  document.addEventListener('change', INPUT_HANDLER);
  document.addEventListener('input', INPUT_HANDLER);

  window.addEventListener('scroll', () => {
    const hd = document.querySelector('header');
    if (hd) hd.classList.toggle('scrolled', window.scrollY > 4);
  }, { passive: true });

  const view = $('view');
  if (view) view.innerHTML = '<div class="empty"><span class="spin"></span> 正在连接…</div>';

  try { S.bridgeMode = await Bridge.probe(); } catch (e) { S.bridgeMode = 'demo'; }
  S.demo = S.bridgeMode === 'demo';
  const banner = $('demo-banner');
  if (banner) banner.classList.toggle('hidden', !S.demo);

  // ★ 不做全屏：状态栏 / 导航栏保持可见

  // ⚠ 首屏要快：status 必须最先（后面依赖它），其余并发；
  //   「写入自检」会写一个 ~10KB 文件再读回（6+ 次桥调用），放到界面上屏之后再做。
  await refreshStatus();
  await Promise.all([loadModel(), loadApps()]);
  await loadModeFreqFromScene();   // 模式页必须是 Scene 真正会下发的那份频率
  render();
  // ⚠ 模板库（apps_tpl）必须**在第二次 render 之前**就绪：
  //   它同时决定「应用页的模板卡」与「筛选项（各模板计数 / 未分配）」。
  //   原来它是最后才发起、回调只做 updateAppList()（增量刷列表），
  //   于是打开应用页看到的是「模板不显示、筛选项不全」——必须全量 render 才会补上。
  await Promise.all([loadFreqs(), loadSceneModes(), loadGames(), loadAppsTpl().catch(() => { })]);
  render();
  // 兜底：万一上面超时/失败，切到应用页时再补一次
  if (!(S.appTplLib || []).length) {
    loadAppsTpl().then(() => render()).catch(() => { });
  }
  logOp('WebUI 启动 · 桥接=' + S.bridgeMode + (Bridge.isRoot ? ' (root)' : '') +
    ' · 当前模式=' + (S.status.MODE_CN || '?'));

  // 轮询刷新：只刷新状态，不整页重渲染。
  //  · 30s 一次（原 20s）—— 每次 status 在后端约 1.3s，是 WebUI 打开时的主要额外负载
  //  · 页面不可见（切走 / 息屏）时**完全不请求**，避免后台白跑
  //  · 正在输入 / 正在忙 → 跳过，别打断用户
  setInterval(async () => {
    if (document.hidden) return;
    if (S.busy || S.applying) return;
    const ae = document.activeElement;
    if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
    try {
      await refreshStatus();
      if (S.tab === 'overview') render();
    } catch (e) { }
  }, 30000);
}

document.addEventListener('DOMContentLoaded', boot);

async function loadFreqs() {
  if (Object.keys(S.freqs).length) return S.freqs;
  S.freqs = await Api.freqs();
  return S.freqs;
}

async function refreshStatus() {
  S.status = await Api.status();
  S.debug = String(S.status.DEBUG) === '1' ? 1 : 0;   // 日志开关（影响守护写盘）
  S.mode = await Api.modes();
  const sv = $('saved');
  if (sv) sv.textContent = S.savedAt ? '已保存 ' + S.savedAt : '';
}

async function loadSceneModes() {
  const o = await Api.appmodes();
  S.sceneDefault = o.SCENE_DEFAULT || 'balance';
  S.sceneCount = {
    powersave: +o.COUNT_powersave || 0, balance: +o.COUNT_balance || 0,
    performance: +o.COUNT_performance || 0, fast: +o.COUNT_fast || 0
  };
  const map = {}, own = {};
  Object.keys(o).forEach(k => {
    if (k.indexOf('A_') === 0) map[k.slice(2)] = o[k];        // 生效模式（含跟随全局的）
    else if (k.indexOf('OWN_') === 0) own[k.slice(4)] = o[k];  // 只在 Scene 里显式设过的
  });
  S.appMode = map;
  S.ownMode = own;
  return map;
}

async function loadGames() {
  // 游戏列表 / 模板 / 分配全部来自 Scene（cmd_games），不再读旧版 gamesjson
  const r = await loadSceneGames();
  // 顺带读一次 Scene 的 FAS 调速器 —— 游戏页那个「设为 xres」按钮要显示当前值
  // （读不到就置 null，卡片上显示「未知」，不影响别的）
  try {
    const kv = Api._kv(await Api.conf('fas'));
    S.fasGov = {
      l: String(kv.governor_little || '').trim(),
      m: String(kv.governor_middle || '').trim(),
      p: String(kv.governor_prime || '').trim()
    };
  } catch (e) { S.fasGov = null; }
  return r;
}

async function refreshAll() {
  // 并发拉取（串行要 ~2.5s，并发 ~0.9s）
  await refreshStatus();
  await Promise.all([
    loadFreqs(),
    S.model ? Promise.resolve() : loadModel(),
    loadSceneModes(), loadGames(), loadAppsTpl(), loadBackups(), loadAudit()
  ]);
  await loadModeFreqFromScene();
  if (S.tab === 'apps') updateAppList(); else render();
}

/* 配置完整性审计（概览页「注错文件清单」用）
   ⚠ 只是只读检测，开机跑一次即可；失败就留空，不阻塞上屏。 */
async function loadAudit() {
  try {
    const r = parseAudit(await Api.audit());
    S.auditBad = r.bad;
    S.auditAt = new Date().toTimeString().slice(0, 8);
  } catch (e) { S.auditBad = []; }
  return S.auditBad;
}

/* 调度配置备份列表（概览页「恢复备份」下拉用） */
async function loadBackups() {
  try {
    S.backups = await Api.profilelist();
  } catch (e) { S.backups = []; }
  return S.backups;
}

async function loadLogs() {
  const ml = $('modlog');
  if (ml) ml.textContent = (await Api.run('log 80')) || '(空)';
}

function render() {
  const view = $('view'); if (!view) return;
  const chip = $('conn-chip');
  if (chip) {
    const m = S.bridgeMode || 'demo';
    const bad = m === 'demo';
    chip.className = 'pill ' + (bad ? 'bad' : 'ok');
    chip.textContent = bad ? '未连接' : (m === 'official' ? '已连接' : '已连接 · ' + m);
  }
  document.querySelectorAll('.tabs [data-tab]').forEach(b =>
    b.classList.toggle('on', b.getAttribute('data-tab') === S.tab));
  const fn = {
    overview: viewOverview, modes: viewModes, apps: viewApps,
    games: viewGames, log: viewLog
  }[S.tab];
  if (!fn) return;
  const out = fn();
  if (out && typeof out.then === 'function') {
    console.error('view "' + S.tab + '" is async; must return a string');
    view.innerHTML = '<div class="empty">视图渲染出错：' + esc(S.tab) + '</div>';
    return;
  }
  view.innerHTML = out;
  renderDirtyBar();
  if (S.tab === 'apps') afterAppsRender();
  if (S.tab === 'log') loadLogs();
  if (S.tab === 'modes' && !Object.keys(S.freqs).length) {
    loadFreqs().then(() => { if (S.tab === 'modes') render(); });
  }
}

function bindAppListScroll() {
  const box = $('applist'), more = $('more');
  if (!box || !more) return;
  if (typeof IntersectionObserver !== 'function') {
    more.textContent = '点击加载更多';
    more.onclick = () => { S.showCount += 80; render(); };
    return;
  }
  const io = new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting)) { S.showCount += 80; render(); }
  }, { root: box, rootMargin: '200px' });
  io.observe(more);
}
