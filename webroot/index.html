<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>玄戒O3 · Abel 调度工具箱</title>
<style>
/* ============================================================
   玄戒O3 · Abel 调度工具箱 —— WebUI 样式
   风格：iOS / Miuix 混合 —— 大圆角卡片、分组列表、胶囊按钮
   主题：跟随系统深浅色（MIUI/Miuix 的 prefers-color-scheme）
   ============================================================ */

:root {
  --bg:        #f2f3f7;
  --bg-elev:   #ffffff;
  --card:      #ffffff;
  --line:      rgba(0, 0, 0, .075);
  --line-soft: rgba(0, 0, 0, .045);
  --text:      #101114;
  --sub:       #8a8f99;
  --sub2:      #a9aeb8;
  --accent:    #0a84ff;
  --accent-2:  #3f9bff;
  --ok:        #24c07a;
  --warn:      #f2a33c;
  --bad:       #ff4d4f;
  --chip-bg:   rgba(120, 120, 128, .12);
  --shadow:    0 1px 2px rgba(16, 18, 24, .05), 0 8px 24px -12px rgba(16, 18, 24, .14);
  --radius:    16px;
  --radius-s:  11px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #0b0c0f;
    --bg-elev:   #14161a;
    --card:      #17191e;
    --line:      rgba(255, 255, 255, .09);
    --line-soft: rgba(255, 255, 255, .05);
    --text:      #f2f3f5;
    --sub:       #9aa0ab;
    --sub2:      #767c87;
    --accent:    #3f9bff;
    --accent-2:  #62b0ff;
    --ok:        #35d18b;
    --warn:      #ffb454;
    --bad:       #ff5c5e;
    --chip-bg:   rgba(120, 120, 128, .22);
    --shadow:    0 1px 2px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "MiSans", "HarmonyOS Sans SC",
        "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body { padding-bottom: 28px; }

.mono {
  font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  font-size: .92em;
}

/* ---------- 顶栏 ---------- */
header {
  position: sticky; top: 0; z-index: 30;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
header.scrolled { border-bottom-color: var(--line); }

.h-top { display: flex; align-items: center; gap: 9px; }
.h-top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
.h-ver {
  font-size: 11px; color: var(--sub);
  background: var(--chip-bg); padding: 2px 8px; border-radius: 99px;
}
.h-chips { margin-left: auto; display: flex; align-items: center; gap: 6px; }
/* 顶部刷新按钮：背景与「应用」主按钮保持一致 */
.h-btn {
  width: 27px; height: 27px; flex: none; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 9px; cursor: pointer;
  background: var(--accent); color: #fff;
  transition: transform .12s, opacity .12s;
}
.h-btn:active { transform: scale(.94); opacity: .86; }

.h-sub {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--sub); margin-top: 3px; min-height: 17px;
}
.h-sub #saved { margin-left: auto; }

.tabs {
  display: flex; gap: 4px; margin: 10px -16px 0; padding: 0 16px 9px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; border: 0; background: transparent; color: var(--sub);
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 7px 13px; border-radius: 99px; cursor: pointer;
  transition: background .16s, color .16s;
}
.tabs button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

main { padding: 14px 16px 0; }

/* ---------- 分组 ---------- */
.group { margin-bottom: 20px; }
.g-title {
  font-size: 12.5px; font-weight: 600; color: var(--sub);
  padding: 0 4px 7px; letter-spacing: .2px;
}
.g-title.rowhead { display: flex; align-items: center; gap: 10px; }
.g-title.rowhead .btn { flex: none; margin-left: auto; }
.g-foot { font-size: 12px; color: var(--sub); line-height: 1.6; padding: 8px 4px 0; }
.g-foot b { color: var(--text); font-weight: 600; }

.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.card > .row + .row { border-top: 1px solid var(--line-soft); }

.row { display: flex; align-items: center; gap: 12px; padding: 13px 15px; }
.row.tappable { cursor: pointer; }
.row.tappable:active { background: var(--line-soft); }
.r-main { flex: 1; min-width: 0; }
.r-t { font-size: 14.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
.r-s { font-size: 12.5px; color: var(--sub); margin-top: 2px; line-height: 1.45; word-break: break-all; }
.r-s .mono { color: var(--sub); }

.kv-row { display: flex; align-items: baseline; gap: 12px; padding: 11px 15px; }
.kv-row + .kv-row { border-top: 1px solid var(--line-soft); }
.kv-row .k { font-size: 13.5px; color: var(--text); flex: none; }
.kv-row .k.mono { color: var(--sub); }
.kv-row .v { margin-left: auto; font-size: 13.5px; color: var(--sub); text-align: right; word-break: break-all; }

.empty { padding: 26px 16px; text-align: center; color: var(--sub); font-size: 13.5px; }

/* ---------- 圆点 / 胶囊 ---------- */
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.d-ok { background: var(--ok); } .d-warn { background: var(--warn); } .d-bad { background: var(--bad); }

.pill {
  font-size: 11.5px; font-weight: 500; padding: 2.5px 8px; border-radius: 99px;
  background: var(--chip-bg); color: var(--sub); white-space: nowrap;
}
.pill.ok     { background: color-mix(in srgb, var(--ok) 16%, transparent);   color: var(--ok); }
.pill.warn   { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad    { background: color-mix(in srgb, var(--bad) 16%, transparent);  color: var(--bad); }
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }

/* ---------- 按钮 ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 500;
  padding: 10px 16px; border-radius: 12px;
  background: var(--chip-bg); color: var(--text);
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.975); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger  { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.btn.ghost   { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .38; pointer-events: none; }
.btn-row { display: flex; gap: 9px; padding: 12px 15px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; min-width: 108px; }
.btn-xs { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 9px; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 12px 15px; }

/* ---------- 表单 ---------- */
input.f, select.f, textarea.f {
  font: inherit; font-size: 14px; color: var(--text);
  background: var(--chip-bg); border: 0; border-radius: 10px;
  padding: 9px 12px; outline: none; min-width: 0; width: 100%;
}
select.f { appearance: none; -webkit-appearance: none; }
textarea.f { resize: vertical; line-height: 1.5; }

.sw { position: relative; display: inline-block; width: 47px; height: 29px; flex: none; }
.sw input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
.sw i {
  position: absolute; inset: 0; border-radius: 99px;
  background: var(--chip-bg); transition: background .2s;
}
.sw i::after {
  content: ''; position: absolute; top: 2.5px; left: 2.5px;
  width: 24px; height: 24px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .28); transition: transform .2s;
}
.sw input:checked + i { background: var(--ok); }
.sw input:checked + i::after { transform: translateX(18px); }

/* ---------- 提示条 ---------- */
.warnbox {
  margin: 0 15px 12px; padding: 11px 13px; border-radius: 12px;
  font-size: 12.5px; line-height: 1.6;
  background: color-mix(in srgb, var(--warn) 11%, transparent);
  color: var(--text);
}
.warnbox.bad { background: color-mix(in srgb, var(--bad) 11%, transparent); }
.warnbox.ok  { background: color-mix(in srgb, var(--ok) 11%, transparent); }
.warnbox b { font-weight: 600; }

/* ---------- 模式卡片 ---------- */
.modegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modecard {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 13px 14px; cursor: pointer;
  border: 1.5px solid transparent;
  transition: border-color .15s, background .15s, transform .1s;
}
.modecard:active { transform: scale(.985); }
.modecard.on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 9%, var(--card));
}
.mc-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.mc-n { font-size: 16px; font-weight: 700; flex: 1; }
.mc-b { font-size: 12px; color: var(--sub); line-height: 1.7; }
.mc-b b { color: var(--text); font-weight: 600; }

/* ---------- 频率行 ---------- */
.freqrow { display: flex; align-items: baseline; gap: 12px; padding: 11px 15px; }
.freqrow + .freqrow { border-top: 1px solid var(--line-soft); }
.freqrow .fn { font-size: 13.5px; color: var(--text); flex: none; width: 54px; }
.freqrow .fv { margin-left: auto; font-size: 13px; color: var(--sub); text-align: right; }
.freqrow .fv b { color: var(--text); font-weight: 600; }

/* ---------- 各模式频率档位编辑器 ---------- */
.freqmode { border-top: 1px solid var(--line-soft); }
.freqmode:first-child { border-top: 0; }
.freqmode.cur > .freqmode-h { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.freqmode-h { display: flex; align-items: center; gap: 10px; padding: 13px 15px; cursor: pointer; }
.freqmode-h:active { background: var(--line-soft); }
.freqmode.on .freqmode-h { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.fmode-t { flex: 1; min-width: 0; }
.freqmode-caret { color: var(--sub); transition: transform .28s cubic-bezier(.4, 0, .2, 1); flex: none; }
.freqmode.on .freqmode-caret { transform: rotate(180deg); color: var(--accent); }
/* 展开动画：max-height + opacity 过渡，避免 display 切换导致的布局跳动 */
.freqmode-body {
  max-height: 0; overflow: hidden; opacity: 0;
  padding: 0 15px;
  transition: max-height .28s cubic-bezier(.4, 0, .2, 1), opacity .2s ease, padding .28s ease;
}
.freqmode.on .freqmode-body {
  opacity: 1; padding: 6px 15px 16px;
  background: color-mix(in srgb, var(--accent) 4%, transparent);
  box-shadow: inset 0 1px 0 var(--line-soft);
}
.freq3 { display: flex; align-items: center; gap: 7px; padding: 7px 0; flex-wrap: wrap; }
.freq3 + .freq3 { border-top: 1px dashed var(--line-soft); }
.f3-n { font-size: 13.5px; font-weight: 600; width: 46px; flex: none; }
.f3-l { font-size: 11.5px; color: var(--sub); }
.f3-s { width: auto; flex: 1; min-width: 96px; }
.freqmode-actions { display: flex; gap: 9px; margin-top: 12px; }
.freqmode-actions .btn { flex: 1; }

/* ---------- 线程：选择栏 / 模板栏 ---------- */
.selbar { display: flex; align-items: center; gap: 8px; padding: 10px 0 4px; flex-wrap: wrap; }
.tplbar { display: flex; align-items: center; gap: 7px; padding: 6px 0 8px; flex-wrap: wrap; }
.tplbar-l { font-size: 12px; color: var(--sub); }
.app-sel { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
.app-row.sel { background: color-mix(in srgb, var(--accent) 8%, var(--card)); }

/* ---------- 应用列表「窗口」：固定高度可滚动 + 筛选条 ---------- */
.apptoolbar { padding: 10px 15px 4px; }
.apptoolbar .f { margin-bottom: 8px; }
/* 筛选 chips：横向滚动，不换行 */
.chiprow {
  display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  padding: 2px 0 6px; -webkit-overflow-scrolling: touch;
}
.chiprow::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 500;
  padding: 5px 12px; border-radius: 99px; background: var(--chip-bg); color: var(--sub);
  white-space: nowrap; transition: background .15s, color .15s;
}
.fchip.on { background: var(--accent); color: #fff; }
/* 可滚动窗口：约 5-7 行高度，内部滑动加载 */
.appwin {
  max-height: 332px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
}
.appwin .row { padding: 11px 15px; }
.appwin .empty { padding: 22px 16px; }
.winmore { padding: 11px 16px; text-align: center; color: var(--sub); font-size: 12.5px; }
.winmore.loading { color: var(--accent); }

/* ---------- 应用行：图标 + 名称 + 包名 + 标签 ---------- */
.app-row .ai {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  object-fit: cover; background: rgba(140,150,170,.18);
}
.app-row .ai.letter {
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; background: var(--accent);
}
.app-row .app-main { min-width: 0; flex: 1; }
.app-row .app-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-row .app-pkg { font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 图标懒加载包裹：首屏只画字母头像，滚到可见才拉 ksu://icon，失败回退字母 */
.app-row .ai-wrap { position: relative; width: 34px; height: 34px; flex: none; }
.app-row .ai-wrap .ai { position: absolute; inset: 0; width: 100%; height: 100%; }
.app-row .tagrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.selcount { font-size: 12.5px; color: var(--sub); margin-right: 2px; }

/* ---------- Toast ---------- */
#toast {
  position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  margin: 0 auto; width: -webkit-fit-content; width: fit-content;
  z-index: 90;
  max-width: 84vw; padding: 11px 18px; border-radius: 13px;
  background: rgba(20, 21, 26, .94); color: #fff;
  font-size: 13.5px; line-height: 1.45; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
  will-change: opacity;
}
@media (prefers-color-scheme: dark) { #toast { background: rgba(240, 241, 245, .96); color: #101114; } }
#toast.on { opacity: 1; }

/* ---------- 加载指示 ---------- */
.spin {
  display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
  border: 2px solid var(--chip-bg); border-top-color: var(--accent);
  border-radius: 50%; animation: sp .7s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }

.hidden { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="h-top">
    <h1>调度工具箱</h1>
    <span class="h-ver" id="ver">18.2.6</span>
    <div class="h-chips">
      <button class="btn btn-xs primary" id="conn-chip" data-act="apply" title="保存当前页所有变更并应用">应用</button>
      <button class="h-btn" id="hrefresh" data-act="reload" title="重新读取" aria-label="重新读取">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>
  <div class="h-sub">
    <span>玄戒O3 · 4+4+2</span>
    <span>·</span>
    <span id="saved"></span>
  </div>
  <nav class="tabs">
    <button data-tab="freq" class="on">CPU频率</button>
    <button data-tab="appfreq">分应用频率</button>
    <button data-tab="thread">线程分配</button>
  </nav>
</header>

<main>
  <div id="demo-banner" class="group hidden">
    <div class="card"><div class="warnbox bad" style="margin:12px 15px">
      <b>演示模式</b>：没有连上 KernelSU 的 WebUI 桥，当前是内置样例数据，
      <b>任何「保存 / 开关」都不会真正写入</b>。<br>
      请从 <b>KernelSU / SukiSU 管理器 → 模块 → 玄戒O3 · Abel 调度工具箱 → 打开</b> 进入本页。
    </div></div>
  </div>
  <div id="view"></div>
</main>

<div id="toast"></div>

<script>
/* ============================================================
   玄戒O3 · Abel 调度工具箱 —— WebUI 前端（两大块：CPU频率 / 线程分配）
     ① CPU频率：选方案 + 选全局模式 → 同步到 Scene（含启用，不再是自定义模式）
     ② 线程分配：完全使用艇长的 Aether 引擎；按「本机有界面应用」展示
        艇长已定义的线程、允许对未分配应用自定义、其余由艇长自动分配
   ============================================================ */
'use strict';

const MOD_ID = 'SceneO3Tuner';
const STATE_DIR = '/data/adb/SceneO3Tuner';
const MODDIR = '/data/adb/modules/' + MOD_ID;
const SCRIPT = MODDIR + '/Scripts/4+4+2/O3/webui.sh';

/* ============================================================
   1) Bridge —— KernelSU 原生桥适配
   ============================================================ */
const Bridge = {
  K: null, execMode: '', isRoot: true, probes: [], _n: 0,
  detect() { this.K = window.ksu || window.kernelsu || null; return !!this.K; },
  keys() { if (!this.K) return []; try { return Object.keys(this.K); } catch (e) { return []; } },
  has(fn) { return !!(this.K && typeof this.K[fn] === 'function'); },
  _official(cmd, timeout) {
    return new Promise(res => {
      const name = '__ksucb_' + (++this._n) + '_' + Date.now();
      let done = false;
      const fin = r => { if (!done) { done = true; try { delete window[name]; } catch (e) { } res(r); } };
      window[name] = (errno, stdout, stderr) => fin({
        code: parseInt(errno, 10) || 0,
        out: String(stdout == null ? '' : stdout) + String(stderr == null ? '' : stderr)
      });
      try { this.K.exec(cmd, JSON.stringify({}), name); }
      catch (e) { fin({ code: 1, out: 'ERR ' + e }); }
      setTimeout(() => fin({ code: 1, out: 'ERR^no-callback' }), timeout);
    });
  },
  _cbFn(cmd, timeout) {
    return new Promise(res => {
      let done = false;
      const fin = r => { if (!done) { done = true; res(r); } };
      try {
        this.K.exec(cmd, (a, b, c) => fin({
          code: typeof a === 'number' ? a : 0,
          out: (typeof a === 'string' ? a : '') + String(b == null ? '' : b) + String(c == null ? '' : c)
        }));
      } catch (e) { fin({ code: 1, out: 'ERR ' + e }); }
      setTimeout(() => fin({ code: 1, out: 'ERR^no-callback' }), timeout);
    });
  },
  _promise(cmd, timeout) {
    try {
      const p = this.K.exec(cmd);
      if (!p || typeof p.then !== 'function') return { code: 1, out: 'ERR^not-promise' };
      const r = Promise.race([p, new Promise(x => setTimeout(() => x('ERR^timeout'), timeout))]);
      return Promise.resolve(r).then(rr => {
        if (rr === 'ERR^timeout') return { code: 1, out: 'ERR^timeout' };
        if (typeof rr === 'string') return { code: 0, out: rr };
        if (rr && typeof rr === 'object')
          return { code: (rr.errno | 0) || (rr.code | 0) || 0, out: String(rr.stdout || '') + String(rr.stderr || '') + String(rr.output || '') };
        return { code: 0, out: String(rr == null ? '' : rr) };
      });
    } catch (e) { return { code: 1, out: 'ERR ' + e }; }
  },
  async probe() {
    if (!this.detect()) { this.execMode = 'demo'; return 'demo'; }
    const cands = [['official', (c, t) => this._official(c, t)], ['cb', (c, t) => this._cbFn(c, t)], ['promise', (c, t) => this._promise(c, t)]];
    for (const [name, fn] of cands) {
      const r = await fn('echo __ksu_probe', 3000);
      if (/__ksu_probe/.test(r.out || '')) { this.execMode = name; break; }
    }
    if (!this.execMode) this.execMode = 'demo';
    try { const r = await this.exec('id -u'); this.isRoot = String(r.out || '').trim() === '0'; } catch (e) { }
    return this.execMode;
  },
  async exec(cmd) {
    switch (this.execMode) {
      case 'official': return this._official(cmd, 60000);
      case 'cb': return this._cbFn(cmd, 60000);
      case 'promise': return this._promise(cmd, 60000);
      default: return Demo.exec(cmd);
    }
  },
  toast(m) { try { if (this.has('toast')) { this.K.toast(String(m)); return true; } } catch (e) { } return false; },
  // 批量取应用元信息（label / 是否系统 / 图标 URL）。
  //   优先用 KSU 官方桥 Api.getPackagesInfo（直接给 appLabel，图标走 ksu://icon）；
  //   仅在 official 形状且方法存在时走这条路，其它形状/无方法则回退后端 aapt 兜底。
  async pkgInfo(pkgs) {
    const list = pkgs.filter(Boolean);
    if (!list.length) return {};
    const norm = (raw) => {
      // KernelSU 官方桥 getPackagesInfo 可能回 JSON 字符串，也可能回数组
      let arr = raw;
      if (typeof arr === 'string') { try { arr = JSON.parse(arr); } catch (e) { arr = null; } }
      if (!Array.isArray(arr)) return null;
      const m = {};
      arr.forEach(it => {
        if (!it || !it.packageName) return;
        m[it.packageName] = {
          label: it.appLabel || it.packageName,
          sys: it.isSystem ? 1 : 0,
          icon: 'ksu://icon/' + it.packageName
        };
      });
      return m;
    };
    if (this.execMode === 'official' && this.has('getPackagesInfo')) {
      try {
        // 优先回调式（官方签名 getPackagesInfo(pkgs, cb)）；失败再试 Promise 式
        const raw = await new Promise((res, rej) => {
          let settled = false;
          const fin = (v) => { if (!settled) { settled = true; res(v); } };
          try {
            const r = this.K.getPackagesInfo(list, (v) => fin(v));
            if (r && typeof r.then === 'function') r.then(fin, rej);
            else if (r !== undefined && r !== null) fin(r);
          } catch (e) { rej(e); }
          setTimeout(() => fin(null), 8000);
        });
        const m = norm(raw);
        if (m && Object.keys(m).length) {
          list.forEach(p => { if (!m[p]) m[p] = { label: p, sys: 0, icon: '' }; });
          return m;
        }
      } catch (e) { /* 落到 aapt 兜底 */ }
    }
    // 回退：后端 aapt 解析 label + pm path 判系统/第三方
    try {
      const text = await Api.pkginfo(list.join('\n'));
      const m = {};
      String(text).split('\n').forEach(l => {
        if (l.indexOf('PKG=') !== 0) return;
        const rest = l.slice(4); const i = rest.indexOf('\t');
        if (i < 0) return;
        const pkg = rest.slice(0, i); const tail = rest.slice(i + 1).split('\t');
        m[pkg] = { label: tail[0] || pkg, sys: tail[1] === '1' ? 1 : 0, icon: '' };
      });
      list.forEach(p => { if (!m[p]) m[p] = { label: p, sys: 0, icon: '' }; });
      return m;
    } catch (e) {
      const m = {}; list.forEach(p => m[p] = { label: p, sys: 0, icon: '' }); return m;
    }
  }
};

// 应用元信息缓存：S.pkgMeta[pkg] = {label, sys, icon}
const Meta = {
  cache: {},
  async load(pkgs) {
    const need = pkgs.filter(p => p && !this.cache[p]);
    if (need.length) {
      const got = await Bridge.pkgInfo(need);
      Object.keys(got).forEach(k => this.cache[k] = got[k]);
    }
    return this.cache;
  }
};

/* ============================================================
   2) Api —— 调 webui.sh 后端（唯一写入口）
   ============================================================ */
const Api = {
  shq(s) { return /[^\w@%+=:,./-]/.test(s) ? "'" + String(s).replace(/'/g, "'\\''") + "'" : s; },
  build(cmd) { const c = 'sh ' + SCRIPT + ' ' + cmd; return Bridge.isRoot ? c : 'su -c ' + this.shq(c); },
  async raw(cmd) { return await Bridge.exec(this.build(cmd)); },
  async run(cmd) { const r = await this.raw(cmd); return r.out == null ? '' : r.out; },
  _kv(text) {
    const m = {};
    String(text || '').split('\n').forEach(line => {
      const i = line.indexOf('=');
      if (i > 0) m[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return m;
  },
  async status() { return this._kv(await this.run('status')); },
  async schemes() { return String(await this.run('schemes')).split('\n').filter(Boolean); },
  async scheme(name) { return await this.run('scheme ' + this.shq(name)); },
  async mode() { return this._kv(await this.run('mode')); },
  async modeset(mode) { return await this.run('modeset ' + this.shq(mode)); },
  async freqs() { return this._kv(await this.run('freqs')); },
  async freqview() { return this._kv(await this.run('freqview')); },
  async freqsave(b64) { return await this.run('freqsave ' + this.shq(b64)); },
  async frequse(mode, b64) { return await this.run('frequse ' + this.shq(mode) + ' ' + this.shq(b64)); },
  async live() { return await this.run('live'); },
  async ensureguard() { return await this.run('ensureguard'); },
  async pkginfo(pkgs) { return await this.run('pkginfo ' + this.shq(pkgs)); },
  // 分应用频率：每应用一个模式档
  async appfreq() { return await this.run('appfreq'); },
  async appfreqapps() { return await this.run('appfreqapps'); },
  async appfreqset(pkg, mode) { return await this.run('appfreqset ' + this.shq(pkg) + ' ' + this.shq(mode)); },
  async appfreqdel(pkg) { return await this.run('appfreqdel ' + this.shq(pkg)); },
  async appfreqbatch(b64) { return await this.run('appfreqbatch ' + this.shq(b64)); },
  // 线程接管（艇长 Aether）
  async aether() { return await this.run('aether'); },
  async aetherswitch(onoff) { return await this.run('aetherswitch ' + this.shq(onoff)); },
  async aetherapps() { return await this.run('aetherapps'); },
  async aetherset(pkg, tpl) { return await this.run('aetherset ' + this.shq(pkg) + ' ' + this.shq(tpl)); },
  async aetherdel(pkg) { return await this.run('aetherdel ' + this.shq(pkg)); },
  async aethersetbatch(b64) { return await this.run('aethersetbatch ' + this.shq(b64)); }
};

function b64enc(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function b64dec(b64) {
  const clean = (b64 || '').replace(/\s+/g, '');
  if (!clean) return '';
  const bin = atob(clean); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function showToast(m) {
  const t = document.getElementById('toast');
  // 重新触发时先去掉 .on 并强制 reflow，避免「从非居中态瞬间跳到居中」的动画抖动。
  t.classList.remove('on');
  void t.offsetWidth;
  t.textContent = m; t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('on'), 1900);
}
async function busy(msg, fn) {
  const t = document.getElementById('toast');
  t.innerHTML = '<span class="spin"></span> ' + msg; t.classList.add('on');
  try { const r = await fn(); return r; }
  finally { setTimeout(() => t.classList.remove('on'), 400); }
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function fmtFreq(hz) { hz = parseInt(hz, 10); if (!hz) return '—'; return (hz / 1000000).toFixed(2) + ' GHz'; }

function parseApps(text) {

  return out;
}

function collectTier(m) {
  const idx = { L: 0, M: 1, P: 2 };
  const vals = [0, 0, 0, 0, 0, 0];
  document.querySelectorAll('#freqmode-' + m + ' select[data-m="' + m + '"]').forEach(sel => {
    const k = sel.dataset.k, fk = sel.dataset.fk, i = idx[k] * 2 + (fk === 'max' ? 1 : 0);
    vals[i] = sel.value;
  });
  // 每簇保证 最低<=最高（拖错也不会把反置值写进去导致冻屏）
  for (let c = 0; c < 3; c++) {
    const lo = +vals[c * 2], hi = +vals[c * 2 + 1];
    if (lo > hi) { vals[c * 2] = hi; vals[c * 2 + 1] = lo; }
  }
  return m + '\t' + vals.join(' ');
}

async function loadAppFreq() {
  try {
    // 后端 cmd_appfreq 返回形如：AF_<pkg>=<mode> 行 + 一行 AF_N=<数量>。
    // 这里解析成 { pkg: mode } 对象，供 renderAppFreq 判定「已配置 / 当前档」。
    const t = await Api.appfreq();
    const m = {};
    String(t).split('\n').forEach(l => {
      if (l.indexOf('AF_') === 0 && l.indexOf('=') > 3) {
        const i = l.indexOf('=');
        m[l.slice(3, i)] = l.slice(i + 1).trim();
      }
    });
    S.appfreq = m;
  } catch (e) { S.appfreq = {}; }
}
async function loadAppList() {
  if (S.appList) return;
  try {
    S.appList = parseAppList(await Api.appfreqapps());
  } catch (e) { S.appList = []; }
  S.selSet = new Set();
  // 不再此处阻塞：首屏秒开，名字/图标由 hydrateVisible 在后台按可见切片补全
}
function parseAppList(text) {
  // 与线程页一致：APP=pkg|sys(0/1)；附 applied=1 表示该应用已设分应用频率
  return String(text || '').split('\n').filter(l => l.indexOf('APP=') === 0)
    .map(l => { const f = l.slice(4).split('|'); return { pkg: f[0] || '', sys: f[1] || '0' }; })
    .filter(a => a.pkg);
}

function appfreqFiltered() {
  const m = S.appfreq || {};
  const kw = (S.appSearch || '').trim().toLowerCase();
  return (S.appList || []).filter(a => {
    if (kw) {
      const meta = Meta.cache[a.pkg] || {};
      const hay = (a.pkg + ' ' + (meta.label || '')).toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    switch (S.appFilter) {
      case 'sys':   return a.sys === '1';
      case 'third': return a.sys !== '1';
      case 'set':   return !!m[a.pkg];
      case 'unset': return !m[a.pkg];
      default:      return true;
    }
  });
}

// 图标 + 名称 + 包名 + 标签 的通用片段（分应用频率 / 线程页共用）
//   图标懒加载：先画字母头像，IntersectionObserver 滚到可见才拉 ksu://icon，失败回退字母。
//   首屏不再等所有图标，列表秒开。
function appMediaHtml(p, extraBadges) {
  const meta = Meta.cache[p.pkg] || { label: p.pkg, sys: p.sys === '1' ? 1 : 0, icon: '' };
  const label = meta.label || p.pkg;
  const sys = meta.sys === 1 ? 1 : 0;
  const badge = sys ? '<span class="pill">系统</span>' : '<span class="pill accent">第三方</span>';
  const letter = esc((label[0] || '?').toUpperCase());
  // 直接优先走官方桥图标（ksu://icon）；非官方桥拉不到时 onerror 移除自己、露出字母头像
  const icon = meta.icon
    ? '<img class="ai" src="' + esc(meta.icon) + '" alt="" onerror="this.remove()">'
    : '<img class="ai" src="ksu://icon/' + esc(p.pkg) + '" alt="" onerror="this.remove()">';
  return '<div class="ai-wrap" data-ico="' + esc(p.pkg) + '">' +
      '<span class="ai letter">' + letter + '</span>' + icon +
    '</div>' +
    '<div class="app-main">' +
      '<div class="app-name">' + esc(label) + '</div>' +
      '<div class="tagrow"><span class="app-pkg mono">' + esc(p.pkg) + '</span>' + badge + (extraBadges || '') + '</div>' +
    '</div>';
}

function renderAppFreq(keepScroll, noHydrate) {

// 图标懒加载：只给「当前窗口内可见」的 .ai-wrap 拉真实图标，滚到才加载
let _iconIO = null;
function observeIcons(winId) {
  const root = document.getElementById(winId);
  if (!root) return;
  if (typeof IntersectionObserver === 'undefined') return; // 老内核兜底：直接全部尝试拉图标
  if (!_iconIO) {
    _iconIO = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target, pkg = el.dataset.ico;
        if (pkg && !el.dataset.done) { el.dataset.done = '1'; }
        _iconIO.unobserve(el);
      });
    }, { root, rootMargin: '120px' });
  }
  root.querySelectorAll('.ai-wrap[data-ico]:not([data-done])').forEach(el => _iconIO.observe(el));
}

// 异步补全「当前可见切片」的应用名 + 图标：只请求首屏 ~40 个，避免 172 个一次性 aapt 卡死
async function hydrateVisible(kind, force) {
  if (kind === 'thread') {
    const list = currentPkgs ? currentPkgs() : [];
    const slice = list.slice(0, S.showCount || 40);
    await _loadMeta(slice);
    renderApps(true);
    observeIcons('apps-card');
  } else {
    const all = appfreqFiltered();
    const slice = all.slice(0, S.appShow || 40);
    await _loadMeta(slice);
    renderAppFreq(true, true);
    observeIcons('appfreq-win');
  }
}
async function _loadMeta(slice) {
  const pkgs = slice.map(a => a.pkg).filter(p => p && !Meta.cache[p]);
  if (!pkgs.length) return;
  try { await Meta.load(pkgs); } catch (e) {}
}

async function refreshAether() {
  try {
    const text = await Api.aether();
    const m = {};
    text.split('\n').forEach(l => { if (l.indexOf('=') > 0) { const i = l.indexOf('='); m[l.slice(0, i).trim()] = l.slice(i + 1).trim(); } });
    S.aether = m;
    renderAetherCard(m);
  } catch (e) { showToast('读取线程引擎失败'); }
}
function renderAetherCard(m) {
  const on = m.ON === 'on';
  const cb = document.getElementById('aether-on'); if (cb) cb.checked = on;
  const st = document.getElementById('aether-state');
  if (st) st.textContent = on ? '已启用（免重启）' : '已停用';
  const run = document.getElementById('aether-run');
  if (run) run.innerHTML = (m.RUNNING === '1')
    ? '<span class="pill ok">运行中</span> PID ' + esc(m.PID || '') : '<span class="pill warn">未运行</span>';
  const rules = document.getElementById('aether-rules'); if (rules) rules.textContent = m.RULES || '0';
  const topo = document.getElementById('aether-topo');
  if (topo) {
    const e = m.TOPO_L || m.TOPO_E || '', p1 = m.TOPO_M || m.TOPO_P1 || '', hp = m.TOPO_P || m.TOPO_HP || '';
    const parts = [];
    if (e) parts.push('小核 ' + e);
    if (p1) parts.push('中核 ' + p1);
    if (hp) parts.push('大核 ' + hp);
    topo.textContent = parts.length ? (parts.join(' · ') + '（' + (m.TOPO_CLUSTERS || 3) + '簇）') : '—';
  }
  // 艇长特性开关（来自 cmd_aether 的 FEAT_<k>=<v> 逐条输出）
  const featsEl = document.getElementById('aether-feats');
  if (featsEl) {
    const FEAT_META = {
      'ebpf': ['eBPF 加速', '用 eBPF 做线程分类，更省 CPU'],
      'auto-for-none': ['不接管应用自动调度', 'none 角色的应用交给系统默认'],
      'foreground': ['前台优先', '仅前台应用生效线程策略'],
      'load_aware': ['负载感知', '按实时负载把线程上探到更大核'],
      'render_guard': ['渲染守护', '保护 RenderThread 不被压到小核'],
      'min_cpus': ['最小在线核数', '各簇保活的最小核心数']
    };
    const map = {};
    Object.keys(m).forEach(k => { if (k.indexOf('FEAT_') === 0) map[k.slice(5)] = m[k]; });
    const keys = Object.keys(FEAT_META).filter(k => k in map);
    if (!keys.length) { featsEl.innerHTML = '<span class="pill">无</span>'; }
    else {
      featsEl.innerHTML = keys.map(k => {
        const [cn, tip] = FEAT_META[k];
        const val = map[k];
        const isBool = (val === 'true' || val === 'false');
        if (isBool) {
          return '<label class="sw sw-sm" title="' + tip + '"><input type="checkbox" data-feat="' + k + '"' + (val === 'true' ? ' checked' : '') + '><i></i><span>' + cn + '</span></label>';
        }
        return '<span class="feat-kv" title="' + tip + '">' + cn + '：<b>' + esc(val) + '</b></span>';
      }).join('');
    }
  }
}

async function batchApply(tpl) {
  const pkgs = currentPkgs().filter(a => S.sel.has(a.pkg)).map(a => a.pkg);
  if (!pkgs.length) { showToast('请先勾选应用'); return; }
  const payload = pkgs.map(p => p + '\t' + tpl).join('\n');
  const b64 = b64enc(payload);
  const r = await busy('套用中…', () => Api.aethersetbatch(b64));
  if (/OK/.test(r)) {
    showToast('已套用 ' + pkgs.length + ' 个应用 → ' + tpl);
    S.sel.clear();
    await loadApps(); await refreshAether(); renderApps();
  } else {
    showToast('失败：' + (r || '').slice(0, 60));
  }
}

/* ============================================================
   7) 渲染调度 + 页签（lint 要求：tabs 与视图一一对应）
   ============================================================ */
const TABS = { freq: viewFreq, appfreq: viewAppFreq, thread: viewThread };

function switchTab() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const f = TABS[S.tab];
  if (f) f();
}
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const f = TABS[S.tab];
  if (f) f();
}

/* ============================================================
   8) 动作（lint 要求：data-act 全部在此实现）
   ============================================================ */
const ACTIONS = {
  reload: async () => { const f = TABS[S.tab]; if (f) f(); },
  // 顶部「应用」：保存本页全部变更并应用（替代旧的「应用频率」单次下发）
  apply: async () => {
    try {
      if (S.tab === 'freq') return await applyFreqAll();
      if (S.tab === 'appfreq') return await applyAppFreqAll();
      if (S.tab === 'thread') return await applyThreadAll();
    } catch (e) { showToast('应用失败：' + (e.message || e)); }
  },
  scheme: () => openSchemeSheet(),
  // —— 频率档位：展开/收起 + 应用 + 恢复默认 ——
  //  展开只是「看/改」，绝不切频率；只有点「应用」才切全局模式并下发。
  freqtoggle: (b) => {
    const m = b.dataset.mode;
    const el = document.getElementById('freqmode-' + m);
    if (!el) return;
    const open = el.classList.toggle('on');
    const body = el.querySelector('.freqmode-body');
    if (body) body.style.maxHeight = open ? (body.scrollHeight + 40) + 'px' : '0px';
  },
  freqview: (b) => {
    const m = b.dataset.mode;
    const el = document.getElementById('freqmode-' + m);
    if (!el) return;
    el.classList.add('on');
    const body = el.querySelector('.freqmode-body');
    if (body) body.style.maxHeight = (body.scrollHeight + 40) + 'px';
  },
  freqsave: async (b) => {
    const m = b.dataset.mode;
    const line = collectTier(m);
    const b64 = b64enc(line);
    const r = await busy('保存中…', () => Api.freqsave(b64));
    showToast(/OK/.test(r) ? ('已保存 ' + (MODE_CN[m] || m) + ' 档位（未下发）') : ('失败：' + (r || '').slice(0, 60)));
  },
  freqapply: async (b) => {
    const m = b.dataset.mode;
    const line = collectTier(m);
    const b64 = b64enc(line);
    // 应用 = 存盘 + 切到该档 + 下发（用户要的「点击应用再切换」）
    const r = await busy('应用中…', () => Api.frequse(m, b64));
    showToast(/OK/.test(r) ? ('已应用并切到 ' + (MODE_CN[m] || m)) : ('失败：' + (r || '').slice(0, 60)));
    await viewFreq();
    const el = document.getElementById('freqmode-' + m);
    if (el) { el.classList.add('on'); const bd = el.querySelector('.freqmode-body'); if (bd) bd.style.maxHeight = (bd.scrollHeight + 40) + 'px'; }
  },
  freqreset: async (b) => {
    const m = b.dataset.mode;
    // 用内置默认档位写回（清掉自定义）；只存盘，不切换、不下发
    const line = m + '\t' + DEFAULT_TIERS[m];
    const b64 = b64enc(line);
    const r = await busy('恢复默认…', () => Api.freqsave(b64));
    showToast(/OK/.test(r) ? ('已恢复 ' + (MODE_CN[m] || m) + ' 默认档位（未下发）') : ('失败：' + (r || '').slice(0, 60)));
    await viewFreq();
    const el = document.getElementById('freqmode-' + m);
    if (el) { el.classList.add('on'); const bd = el.querySelector('.freqmode-body'); if (bd) bd.style.maxHeight = (bd.scrollHeight + 40) + 'px'; }
  },
  // —— 线程分配：角色档套用 / 全选 / 清空 ——
  batch: async (b) => { await batchApply(b.dataset.cl); },
  selall: () => { currentPkgs().forEach(a => S.sel.add(a.pkg)); renderApps(); },
  selclear: () => { S.sel.clear(); renderApps(); },
  loadmore: () => { S.showCount += 40; renderApps(); },
  aetherswitch: async (b) => {
    const on = b.checked;
    const r = await busy(on ? '启用线程引擎…' : '停用线程引擎…', () => Api.aetherswitch(on ? 'on' : 'off'));
    showToast(/OK/.test(r) ? (on ? '✅ 已启用 Aether' : '已停用 Aether') : ('失败：' + r.slice(0, 60)));
    refreshAether();
  },
  aetherdel: async (b) => { await aetherDel(b.dataset.pkg); },
  // —— 分应用频率：添加 / 删除 / 改档 / 加载更多 ——
  appfreqadd: async (b) => {
    const pkg = b.dataset.pkg;
    const r = await busy('添加中…', () => Api.appfreqset(pkg, 'balance'));
    showToast(/OK/.test(r) ? ('已添加 ' + pkg + ' → 流畅') : ('失败：' + (r || '').slice(0, 60)));
    S.appSearch = ''; const si = document.getElementById('appfreq-search'); if (si) si.value = '';
    await loadAppFreq(); renderAppFreq();
  },
  appfreqdel: async (b) => {
    const pkg = b.dataset.pkg;
    const r = await busy('移除中…', () => Api.appfreqdel(pkg));
    showToast(/OK/.test(r) ? ('已移除 ' + pkg + ' 的分应用频率') : ('失败：' + (r || '').slice(0, 60)));
    await loadAppFreq(); renderAppFreq();
  },
  appfreqmore: () => { S.appShow += 40; renderAppFreq(true); },
  // —— 分应用频率：多选 + 模板套用（对齐线程页逻辑）——
  appfreqselall: () => {
    if (!S.selSet) S.selSet = new Set();
    appfreqFiltered().forEach(a => S.selSet.add(a.pkg));
    renderAppFreq();
  },
  appfreqselclear: () => { if (S.selSet) S.selSet.clear(); renderAppFreq(); },
  appfreqbatchtpl: async () => {
    const tpl = document.getElementById('appfreq-tpl');
    const md = tpl ? tpl.value : '';
    if (!md) { showToast('请先选择要套用的频率档'); return; }
    if (!S.selSet || !S.selSet.size) { showToast('请先勾选应用'); return; }
    const rows = Array.from(S.selSet).map(p => p + '\t' + md);
    const b64 = b64enc(rows.join('\n'));
    const r = await busy('套用中…', () => Api.appfreqbatch(b64));
    if (!/OK/.test(r)) { showToast('失败：' + (r || '').slice(0, 60)); return; }
    S.selSet.clear();
    await loadAppFreq(); await Api.ensureguard(); renderAppFreq();
    showToast('✅ 已为 ' + rows.length + ' 个应用套用「' + md + '」');
  },
  appfreqpowdefault: async () => {
    const r = await busy('设置省电默认…', () => Api.run('powersave_default'));
    showToast(/OK/.test(r) ? '✅ 已把省电档设为默认并下发' : ('失败：' + (r || '').slice(0, 70)));
    await viewFreq();
  }
};
// 分应用频率页勾选联动
document.addEventListener('change', (e) => {
  const cb = e.target;
  if (cb && cb.classList && cb.classList.contains('app-sel') && cb.dataset.sel) {
    if (!S.selSet) S.selSet = new Set();
    if (cb.checked) S.selSet.add(cb.dataset.sel); else S.selSet.delete(cb.dataset.sel);
    const bar = document.getElementById('appfreq-selbar');
    if (bar) { renderAppFreq(); }
  }
});

// 内置默认频率档位（与 util.sh mode_freq 一致），用于「恢复默认」
// v18.2：对齐 O3 实测能效（M 簇 1550MHz 以上纯浪费，中核上限收回实测值）
const DEFAULT_TIERS = {
  powersave: '417792 1560000 556800 1651200 1113600 2169600',
  balance:   '417792 1939200 556800 1968000 1113600 2371200',
  performance: '912000 2899200 1142400 3427200 2044800 4051200',
  fast:      '912000 3148800 1142400 3686400 2044800 4358400'
};

/* 方案选择弹层 */
function openSchemeSheet() {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const sheet = document.createElement('div'); sheet.className = 'sheet';
  const items = (S.schemes.length ? S.schemes : ['sweet_eco|省电', 'sweet_bal|均衡', 'sweet_hq|高画质', 'sweet_perf|性能']).map(s => {
    const i = s.indexOf('|'); const name = i > 0 ? s.slice(0, i) : s; const cn = i > 0 ? s.slice(i + 1) : '';
    const cur = (S.status.SCHEME || 'sweet_bal') === name;
    return '<div class="sheet-item' + (cur ? ' on' : '') + '" data-scheme="' + esc(name) + '">' +
      '<div class="si-n">' + esc(cn || name) + (cur ? ' <span class="pill ok">当前</span>' : '') + '</div>' +
      '<div class="si-s mono">' + esc(name) + '</div></div>';
  }).join('');
  sheet.innerHTML =
    '<div class="sheet-h"><div class="t">选择频率方案</div><button class="btn btn-xs ghost" id="sheet-close">取消</button></div>' +
    '<div class="sheet-b">' + items + '</div>';
  bg.appendChild(sheet); document.body.appendChild(bg);
  requestAnimationFrame(() => { bg.classList.add('on'); sheet.classList.add('on'); });
  const close = () => { bg.classList.remove('on'); sheet.classList.remove('on'); setTimeout(() => bg.remove(), 250); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  sheet.querySelector('#sheet-close').addEventListener('click', close);
  sheet.querySelectorAll('[data-scheme]').forEach(it => it.addEventListener('click', async () => {
    const name = it.dataset.scheme; close();
    const r = await busy('切换方案…', () => Api.scheme(name));
    showToast(/OK/.test(r) ? ('已切换 ' + (SCHEME_CN[name] || name)) : ('失败：' + r.slice(0, 60)));
    viewFreq();
  }));
}

/* ============================================================
   9) 事件绑定 + 启动
   ============================================================ */
document.addEventListener('click', async (e) => {
  const act = e.target.closest('[data-act]');
  if (act) { const fn = ACTIONS[act.dataset.act]; if (fn) { await fn(act); return; } }
  if (e.target.closest('[data-scheme]')) return;
  // 分应用频率 / 线程页 的筛选 chips
  const flt = e.target.closest('[data-flt]');
  if (flt) {
    const key = flt.dataset.flt;
    if (flt.closest('#appfreq-filters')) {
      S.appFilter = key; S.appShow = 40;
      document.querySelectorAll('#appfreq-filters .fchip').forEach(c => c.classList.toggle('on', c === flt));
      renderAppFreq();
    } else if (flt.closest('#app-filters')) {
      S.appfilter = key; S.showCount = 40;
      document.querySelectorAll('#app-filters .fchip').forEach(c => c.classList.toggle('on', c === flt));
      renderApps();
    }
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); return; }
});

document.addEventListener('change', async (e) => {
  const sel = e.target.closest('[data-sel]');
  if (sel) {
    const pkg = sel.dataset.sel;
    if (sel.checked) S.sel.add(pkg); else S.sel.delete(pkg);
    const row = sel.closest('.app-row');
    if (row) row.classList.toggle('sel', sel.checked);
    updateSelCount();
    return;
  }
  const set = e.target.closest('[data-set]');
  if (set) {
    const pkg = set.dataset.set; const val = set.value;
    if (val === 'auto') { await aetherDel(pkg); } else { await aetherSet(pkg, val); }
    return;
  }
  const af = e.target.closest('[data-appfreq]');
  if (af) {
    const pkg = af.dataset.appfreq; const val = af.value;
    if (!val) { await ACTIONS.appfreqdel({ dataset: { pkg: pkg } }); return; }
    const r = await busy('设置中…', () => Api.appfreqset(pkg, val));
    showToast(/OK/.test(r) ? ('已设置 ' + pkg + ' → ' + (MODE_CN[val] || val)) : ('失败：' + (r || '').slice(0, 60)));
    await loadAppFreq(); renderAppFreq();
    return;
  }
  const feat = e.target.closest('[data-feat]');
  if (feat) {
    const k = feat.dataset.feat; const v = feat.checked ? 'true' : 'false';
    const ok = await toggleAetherFeat(k, v);
    if (!ok) { feat.checked = !feat.checked; }
    else { const m = S.aether || {}; m.AETHER_FEATS = (m.AETHER_FEATS || '').replace(new RegExp('(^|;)' + k + ':[^;]*'), '$1' + k + ':' + v); }
    return;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'app-search') { S.appsearch = e.target.value.trim().toLowerCase(); renderApps(); }
  if (e.target.id === 'appfreq-search') { S.appSearch = e.target.value.trim().toLowerCase(); S.appShow = 40; renderAppFreq(); }
});

window.addEventListener('scroll', () => {
  const h = document.querySelector('header'); if (h) h.classList.toggle('scrolled', window.scrollY > 8);
}, { passive: true });

// 应用列表窗口：滚动到底自动加载更多（无限滚动）。
// ⚠ 嵌套 .appwin 的 scroll 事件不会冒泡到 document，必须直接绑到该元素上。
function bindAppwinScroll(id, moreAct) {
  const win = document.getElementById(id); if (!win) return;
  if (win._winBound) return;            // 视图内元素稳定，只绑一次
  win._winBound = true;
  win.addEventListener('scroll', () => {
    if (win.scrollTop + win.clientHeight >= win.scrollHeight - 48) {
      const more = win.querySelector('.winmore');
      if (more && !more.classList.contains('loading')) { more.classList.add('loading'); more.click(); }
    }
  }, { passive: true });
}

(async function boot() {
  const mode = await Bridge.probe();
  const banner = document.getElementById('demo-banner');
  if (mode === 'demo' && banner) banner.classList.remove('hidden');
  const ver = document.getElementById('ver');
  if (ver) ver.textContent = (S.status.VER || '17.12').replace(/^\S+\s/, '').trim() || '17.12';
  render();
})();
</script>
