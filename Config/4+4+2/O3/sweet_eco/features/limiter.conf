# SceneO3Tuner · 辅助调速器（Limiters）—— 玄戒 O3 适配
#   limiters_in_apps  = Scene 的「日用 app 辅助调速器」
#   limiters_in_games = Scene 的「游戏辅助调速器」
#   stat_method       = 负载统计来源（2 = 从 /proc/stat 读 jiffies，精度约 4ms）
#
# ★ 默认**开启**（2026-09-17 用户指定）。它做什么、代价是什么（均为实测）：
#   · 开启后 scene-daemon 会**每秒多次**重写三簇的 scaling_max_freq，
#     把前台应用压到各簇最低频附近（实测 417 / 556 / 1113 MHz）→ 功耗最低；
#     CPU 持续满载时会让路（实测能到 1497 / 1804 / 2044 MHz）。
#   · 代价：1 秒内的突发负载（滑动、打开应用、按快门）响应会变慢 ——
#     相机就是典型受害者。
#   · 关掉（改成 0）则完全跟随「模式 = 频率上限」，跟手性明显更好、功耗略升。
#   ↺ 想换成「更跟手」就把下面两个值改成 0，改完**重启 scene-daemon** 才稳。
#
# ⚠ **相机不受这里影响**：
#   _Camera.json 里每个 mode × state 都带了 ["@limiter","NONE"]，且**必须排在
#   @preset 之后** —— 预设内部自带 limiter_on + @limiter pN，先写 NONE 会被覆盖。
limiters_in_apps=1
stat_method=2
limiters_in_games=1
