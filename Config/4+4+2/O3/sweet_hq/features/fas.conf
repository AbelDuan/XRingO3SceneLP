# SceneO3Tuner · FAS（帧率感知调度）—— 玄戒 O3 适配
# scheme=sweet_bal (日常均衡)
#
# ⚠ 本文件由模块维护。改完需要**重启 scene-daemon** 才稳（它不一定重读 conf）。
#   键名与语义取自 Scene 自身的文案（从它 APK 的 resources 里提取）：
#     governor_little/middle/prime  「FAS/FEAS 工作期间，小/中/大核使用的调速器」
#     fas_engine                    「选择优先使用的 FAS 实现，默认优先系统自带」
#     conservative                  （Scene 无文案，其默认值为 1）
#     fast_down_always              「帧间隔回到正常区间时，更及时地降频」
#     variance_adjust               「平均延迟：按帧率方差动态调整帧间隔平滑算法」
#     margin_offset                 「FAS Lite 默认余量 240~300MHz（按处理器型号）」
#     target_fps_offset             「微调目标帧率，-50 表示目标帧率 -5%」
#     adj_min/max_power             FAS 的目标功耗窗口（W）
#     adj_min/max_bat_temp          电池温度窗口
#     adj_min/max_soc_temp          「温度感知：按电池与 SoC 温度动态调整目标帧率」
#     status_notify                 「FAS 运行状态变化时提示」
#     download_detect               「测速；下载时自动暂停 FAS」
#
# ★ 玄戒 O3 的调速器适配（2026-09-17 实测 + 反汇编 Scene APK 确认）
#
#   ① O3 三簇实际支持哪些 CPU 调度模式（读 /sys/devices/system/cpu/cpu{0,4,8}/cpufreq/
#      scaling_available_governors，三簇一致 —— 这是「CPU 控制」页下拉的真实来源）：
#          xres   conservative   powersave   performance   schedutil
#      其中 `xres` 是厂商主调速器：Scene 的「CPU 控制」页默认就是它，
#      本模块 profile.json 的每个模式 preset 也写 scaling_governor=xres。
#      ⚠ **没有 `walt`** —— 那是 8E 等平台的值，照搬别的机型方案包会指向不存在的调速器。
#
#   ② Scene 的 **FAS 候选列表是硬编码在 APK 里的，不是从内核读的**。
#      反汇编 classes.dex 的 `a.sq0.d()`（即「FAS 开发者选项」里那三个调速器下拉的
#      候选生成器）可见其真实逻辑：
#          基础候选 = (SoC == "mt6991" || SoC == "mt6993")
#                       ? { uag, walt, sugov_ext, schedutil, performance, conservative }
#                       : { performance, conservative, sugov_ext }
#          再取它与内核 available_governors 的**交集**，最后在最前面插入 "auto"
#      ⇒ O3 不在联发科分支，基础候选只有 3 项；与 O3 内核求交后只剩
#        { performance, conservative }，加 "auto" 后即
#        **O3 上 FAS 只有 auto / performance / conservative 三项可选**。
#      对比「CPU 控制」页（直接读内核）= xres / conservative / powersave /
#      performance / schedutil
#      ⇒ **FAS 相比 CPU 控制少了 xres、powersave、schedutil**（另外多一个虚拟项 auto）。
#      这是 Scene 自身的实现限制，**无法通过配置文件扩展候选列表**。
#
#   ③ 因此这里把 governor_* 明确写成 `xres`（而不是 Scene 的 `auto`）：
#        · 与「CPU 控制」页的默认值、以及 profile.json 里各模式 preset 的
#          scaling_governor=xres **三处一致**（这就是「两处可选调度模式保持一致」
#          在本机型上能做到的形式：值统一 + 由模块侧兜底）；
#        · Scene **不校验**写入值 —— 实测写成 xres 后重启 daemon，值被原样保留；
#        · ⚠ 代价：Scene 的 FAS 下拉候选里没有 xres，UI 上那一格可能显示不出选中态
#          （值仍会被 FAS 在运行时写进 scaling_governor）。想改回「让 Scene 自己挑」
#          就写回 `auto`。
#
#   ④ governor_* **只在 FAS/FEAS 运行期间生效**（Scene 文案原文：
#      "Governor used by little/middle/big cores during FAS/FEAS operation"）。
#      实测：显式写值后重启 daemon，scaling_governor 仍是 xres —— 这是正常的，不是没生效。
#      **兜底**：本模块 profile.json 的每个模式 preset 都直接写 scaling_governor=xres，
#      所以即使 FAS 从未启动，日常/游戏模式的调速器也恒为 xres。
#
#   ⑤ fas_engine 保留 Scene 的原值 `feas|fas|fas_lite`：
#      这是 Scene 自己写下的字面量（同版本 APK 的字符串表里能直接找到），
#      **不是**「可选值列表被误写进值里」。
#
#   ⑥ FAS 只对 `features/fas_whitelist.conf` 里的游戏生效（Scene 的原文：
#      「可以强制关闭，但无法强制开启未适配的游戏」）。本机那份名单是 Scene 自带
#      的（sgame / pubgmhd / lolm …），模块不动它。
governor_little=xres
governor_middle=xres
governor_prime=xres
fas_engine=feas|fas|fas_lite
conservative=1
fast_down_always=1
variance_adjust=1
margin_offset=300
target_fps_offset=0
adj_min_power=6.0
adj_max_power=9.0
adj_min_bat_temp=38.0
adj_max_bat_temp=45.0
adj_min_soc_temp=65.0
adj_max_soc_temp=88.0
status_notify=1
download_detect=0
