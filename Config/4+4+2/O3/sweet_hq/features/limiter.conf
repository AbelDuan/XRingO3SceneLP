# SceneO3Tuner · 辅助调速器（Limiters）—— 玄戒 O3 适配
#
# ★★ 键名已用 Scene APK 校正（2026-09-18）。旧版本写的 `limiters_in_apps` /
#    `limiters_in_games` / `stat_method` **在 Scene 的 classes.dex 与 resources.arsc
#    里都不存在** → Scene 根本不读，等于这个文件一直没生效过。
#    真实键名取自 Scene 自己的字符串表（UI id）：
#      limiter_apps      「运行普通应用时使用辅助调速器抑制处理器性能和功耗」
#      limiter_games     「运行游戏时使用辅助调速器抑制处理器性能和功耗」
#      limiter_jiffies   （对应原 stat_method：负载统计是否用 /proc/stat 的 jiffies，
#                         精度约 4ms。**取值格式未完全确认，按 boolean 写 1**）
#    另有 limiter_scope / limiter_infinite / limiter_toast(_desc) / limiter_preference
#    等 id，语义未确认 → 不写。
#
# ⚠ 它做什么（旧注释基于实测行为，行为描述本身仍成立）：
#   · 开启后 scene-daemon 会**每秒多次**重写三簇的 scaling_max_freq
#     （设备侧 1Hz 采样实测：中核 max 有 64% 的秒间隔在变，12 个唯一值 556800~2294400），
#     把前台压到各簇最低频附近 → 功耗最低；CPU 持续满载时会让路。
#   · 代价：1 秒内的突发负载（滑动、打开应用、按快门）响应会变慢。
#   · 关掉则完全跟随「模式 = 频率上限」，跟手性更好、功耗略升。
#   ↺ 想换成「更跟手」就把 limiter_apps 改为 0，改完**重启 scene-daemon** 才稳。
#
# ⚠ 相机不受这里影响：_Camera.json 每个 mode × state 都带 ["@limiter","NONE"]，
#   且**必须排在 @preset 之后** —— 预设内部自带 limiter_on，先写 NONE 会被覆盖。
limiter_apps=1
limiter_games=1
limiter_jiffies=1
